services:
  postgres:
    image: postgres:17.9
    environment:
      POSTGRES_DB: wellisha_local
      POSTGRES_USER: wellisha_local
      POSTGRES_PASSWORD: local-development-only
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wellisha_local -d wellisha_local"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - wellisha-local-pg:/var/lib/postgresql/data
volumes:
  wellisha-local-pg:

