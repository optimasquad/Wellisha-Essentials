240,710 400,710 400,780" fill="none" stroke="#526779" stroke-width="1.6" marker-end="url(#arrow)"/><polyline points="1700,615 1740,615 1740,830 1700,830" fill="none" stroke="#526779" stroke-width="1.6" stroke-dasharray="6 5" marker-end="url(#arrow)"/><polyline points="650,970 650,925 1150,925 1150,860 1220,860" fill="none" stroke="#526779" stroke-width="1.6" stroke-dasharray="6 5" marker-end="url(#arrow)"/><polyline points="1700,650 1770,650 1770,1135 265,1135" fill="none" stroke="#526779" stroke-width="1.6"/><polyline points="265,1135 265,1065" fill="none" stroke="#526779" stroke-width="1.6" marker-end="url(#arrow)"/><polyline points="1065,1135 1065,1065" fill="none" stroke="#526779" stroke-width="1.6" marker-end="url(#arrow)"/><polyline points="1500,1135 1500,1065" fill="none" stroke="#526779" stroke-width="1.6" marker-end="url(#arrow)"/><polyline points="470,1135 470,1160" fill="none" stroke="#526779" stroke-width="1.6" marker-end="url(#arrow)"/><polyline points="1315,1135 1315,1160" fill="none" stroke="#526779" stroke-width="1.6" stroke-dasharray="6 5" marker-end="url(#arrow)"/><polyline points="350,315 35,315 35,1015 100,1015" fill="none" stroke="#526779" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="70" y="140" width="300" height="80" rx="5" fill="#E8F0FE" stroke="#8291A0"/><text font-family="Arial, sans-serif" font-size="15" fill="#202B37" text-anchor="middle"><tspan x="220" y="175.5">Web customer</tspan><tspan x="220" y="195">Desktop + mobile browser</tspan></text><rect x="420" y="140" width="300" height="80" rx="5" fill="#E8F0FE" stroke="#8291A0"/><text font-family="Arial, sans-serif" font-size="15" fill="#202B37" text-anchor="middle"><tspan x="570" y="175.5">Android + iOS apps</tspan><tspan x="570" y="195">React Native / Expo</tspan></text><rect x="770" y="140" width="300" height="80" rx="5" fill="#E8F0FE" stroke="#8291A0"/><text font-family="Arial, sans-serif" font-size="15" fill="#202B37" text-anchor="middle"><tspan x="920" y="175.5">Admin + agent console</tspan><tspan x="920" y="195">Catalog, support, cancellations</tspan></text><rect x="1330" y="140" width="380" height="80" rx="5" fill="#FCE8E6" stroke="#8291A0"/><text font-family="Arial, sans-serif" font-size="15" fill="#202B37" text-anchor="middle"><tspan x="1520" y="175.5">Google / Microsoft / Apple</tspan><tspan x="1520" y="195">Registered identity providers</tspan></text><rect x="350" y="270" width="590" height="90" rx="5" fill="#E8F0FE" stroke="#8291A0"/><text font-family="Arial, sans-serif" font-size="15" fill="#202B37" text-anchor="middle"><tspan x="645" y="310.5">Route 53 + ACM</tspan><tspan x="645" y="330">CloudFront + AWS WAF</tspan></text><rect x="1330" y="270" width="380" height="90" rx="5" fill="#E8F0FE" stroke="#8291A0"/><text font-family="Arial, sans-serif" font-size="15" fill="#202B37" text-anchor="middle"><tspan x="1520" y="310.5">Amazon Cognito</tspan><tspan x="1520" y="330">Federation + access tokens</tspan></text><rect x="350" y="420" width="590" height="80" rx="5" fill="#F2F4F7" stroke="#8291A0"/><text font-family="Arial, sans-serif" font-size="15" fill="#202B37" text-anchor="middle"><tspan x="645" y="455.5">Application Load Balancer</tspan><tspan x="645" y="475">Separate web and API target groups</tspan></text><rect x="100" y="560" width="360" height="110" rx="5" fill="#E6F4EA" stroke="#8291A0"/><text font-family="Arial, sans-serif" font-size="15" fill="#202B37" text-anchor="middle"><tspan x="280" y="600.75">ECS Fargate: Next.js web</tspan><tspan x="280" y="620.25">SSR + session BFF</tspan><tspan x="280" y="639.75">No database credentials</tspan></text><rect x="570" y="560" width="480" height="110" rx="5" fill="#E6F4EA" stroke="#8291A0"/><text font-family="Arial, sans-serif" font-size="15" fill="#202B37" text-anchor="middle"><tspan x="810" y="600.75">ECS Fargate: Commerce API</tspan><tspan x="810" y="620.25">Catalog | Cart | Orders | Tracking</tspan><tspan x="810" y="639.75">Payments | Support | Agent actions</tspan></text><rect x="1220" y="560" width="480" height="110" rx="5" fill="#E6F4EA" stroke="#8291A0"/><text font-family="Arial, sans-serif" font-size="15" fill="#202B37" text-anchor="middle"><tspan x="1460" y="600.75">ECS Fargate: Workers</tspan><tspan x="1460" y="620.25">Import | Cache | Payment | Fulfillment</tspan><tspan x="1460" y="639.75">Refund | Notifications | Outbox relay</tspan></text><rect x="100" y="780" width="420" height="105" rx="5" fill="#FFF2CC" stroke="#8291A0"/><text font-family="Arial, sans-serif" font-size="15" fill="#202B37" text-anchor="middle"><tspan x="310" y="818.25">RDS PostgreSQL Multi-AZ</tspan><tspan x="310" y="837.75">Source of truth</tspan><tspan x="310" y="857.25">Reservations + inbox + outbox</tspan></text><rect x="600" y="780" width="450" height="105" rx="5" fill="#FFF2CC" stroke="#8291A0"/><text font-family="Arial, sans-serif" font-size="15" fill="#202B37" text-anchor="middle"><tspan x="825" y="818.25">ElastiCache for Valkey</tspan><tspan x="825" y="837.75">Versioned catalog read cache</tspan><tspan x="825" y="857.25">Checkout revalidates in DB</tspan></text><rect x="1220" y="780" width="480" height="105" rx="5" fill="#E6F3F7" stroke="#8291A0"/><text font-family="Arial, sans-serif" font-size="15" fill="#202B37" text-anchor="middle"><tspan x="1460" y="818.25">EventBridge -&gt; dedicated SQS queues</tspan><tspan x="1460" y="837.75">Each queue has a DLQ</tspan><tspan x="1460" y="857.25">Idempotent workers + reconciliation</tspan></text><rect x="100" y="970" width="330" height="95" rx="5" fill="#FFF2CC" stroke="#8291A0"/><text font-family="Arial, sans-serif" font-size="15" fill="#202B37" text-anchor="middle"><tspan x="265" y="1003.25">S3</tspan><tspan x="265" y="1022.75">Images, imports, invoices</tspan><tspan x="265" y="1042.25">Restricted buckets / prefixes</tspan></text><rect x="470" y="970" width="360" height="95" rx="5" fill="#E6F3F7" stroke="#8291A0"/><text font-family="Arial, sans-serif" font-size="15" fill="#202B37" text-anchor="middle"><tspan x="650" y="1003.25">EventBridge Scheduler</tspan><tspan x="650" y="1022.75">Imports, expiry, reconciliation</tspan><tspan x="650" y="1042.25">S3 events also enqueue imports</tspan></text><rect x="880" y="970" width="370" height="95" rx="5" fill="#FCE8E6" stroke="#8291A0"/><text font-family="Arial, sans-serif" font-size="15" fill="#202B37" text-anchor="middle"><tspan x="1065" y="1003.25">Razorpay</tspan><tspan x="1065" y="1022.75">Hosted checkout</tspan><tspan x="1065" y="1042.25">Signed payment/refund webhooks</tspan></text><rect x="1300" y="970" width="400" height="95" rx="5" fill="#FCE8E6" stroke="#8291A0"/><text font-family="Arial, sans-serif" font-size="15" fill="#202B37" text-anchor="middle"><tspan x="1500" y="1003.25">Fulfillment adapter</tspan><tspan x="1500" y="1022.75">Amazon Shipping (store pickup)</tspan><tspan x="1500" y="1042.25">Create, track, cancel, return</tspan></text><rect x="100" y="1160" width="740" height="80" rx="5" fill="#E6F3F7" stroke="#8291A0"/><text font-family="Arial, sans-serif" font-size="15" fill="#202B37" text-anchor="middle"><tspan x="470" y="1195.5">SES email + AWS End User Messaging SMS</tspan><tspan x="470" y="1215">Independent queues; delivery receipts; registered templates</tspan></text><rect x="930" y="1160" width="770" height="80" rx="5" fill="#FCE8E6" stroke="#8291A0"/><text font-family="Arial, sans-serif" font-size="15" fill="#202B37" text-anchor="middle"><tspan x="1315" y="1185.75">Optional marketplace sales channels</tspan><tspan x="1315" y="1205.25">Flipkart / Meesho require verified partner access</tspan><tspan x="1315" y="1224.75">Not assumed to deliver Wellisha-origin orders</tspan></text><text font-family="Arial, sans-serif" font-size="28" fill="#202B37" font-weight="700"><tspan x="49" y="55.8">01  AWS Architecture</tspan></text><text font-family="Arial, sans-serif" font-size="16" fill="#202B37"><tspan x="49" y="103.1">Wellisha owns checkout | Web + Android + iOS | Proposed production deployment in Mumbai</tspan></text><text font-family="Arial, sans-serif" font-size="14" fill="#202B37"><tspan x="1009" y="248.3">All clients</tspan><tspan x="1009" y="266.5">Cognito + PKCE</tspan></text><text font-family="Arial, sans-serif" font-size="14" fill="#202B37"><tspan x="729" y="394.9">API + personalized pages: no CDN cache</tspan></text><text font-family="Arial, sans-serif" font-size="14" fill="#202B37"><tspan x="1059" y="454.9">API validates Cognito tokens, roles and ownership</tspan></text><text font-family="Arial, sans-serif" font-size="13" fill="#202B37"><tspan x="1044" y="765.05">Cache refresh</tspan></text><text font-family="Arial, sans-serif" font-size="13" fill="#202B37"><tspan x="109" y="911.55">Workers read/write owned records; relay publishes committed outbox events</tspan></text><text font-family="Arial, sans-serif" font-size="14" fill="#202B37"><tspan x="519" y="1100.9">Provider calls originate from API/workers; signed callbacks enter via edge -&gt; API inbox.</tspan></text><text font-family="Arial, sans-serif" font-size="16" fill="#202B37"><tspan x="79" y="1291.6">Private subnets: ECS, database and cache | Two AZs | Scoped IAM + KMS + Secrets Manager | Controlled outbound access</tspan></text><text font-family="Arial, sans-serif" font-size="15" fill="#202B37"><tspan x="79" y="1346.25">CloudWatch + OpenTelemetry + CloudTrail | GitHub Actions OIDC -&gt; ECR -&gt; CDK deployment | Solid: request/data; dashed: events/auth</tspan></text></svg>