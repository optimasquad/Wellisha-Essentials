<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1302" viewBox="0 0 1800 1302"><title>03  Catalog and Price Publication</title><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,4 L0,8 Z" fill="#526779"/></marker></defs><rect width="100%" height="100%" fill="white"/><polyline points="200,212 200,1177" fill="none" stroke="#526779" stroke-width="1.6" stroke-dasharray="6 5"/><polyline points="480,212 480,1177" fill="none" stroke="#526779" stroke-width="1.6" stroke-dasharray="6 5"/><polyline points="760,212 760,1177" fill="none" stroke="#526779" stroke-width="1.6" stroke-dasharray="6 5"/><polyline points="1040,212 1040,1177" fill="none" stroke="#526779" stroke-width="1.6" stroke-dasharray="6 5"/><polyline points="1320,212 1320,1177" fill="none" stroke="#526779" stroke-width="1.6" stroke-dasharray="6 5"/><polyline points="1600,212 1600,1177" fill="none" stroke="#526779" stroke-width="1.6" stroke-dasharray="6 5"/><polyline points="200,270 480,270" fill="none" stroke="#526779" stroke-width="1.6" stroke-dasharray="6 5" marker-end="url(#arrow)"/><polyline points="480,346 545,346 545,372 480,372" fill="none" stroke="#526779" stroke-width="1.6" marker-end="url(#arrow)"/><polyline points="480,422 760,422" fill="none" stroke="#526779" stroke-width="1.6" marker-end="url(#arrow)"/><polyline points="760,498 480,498" fill="none" stroke="#526779" stroke-width="1.6" stroke-dasharray="6 5" marker-end="url(#arrow)"/><polyline points="1040,574 760,574" fill="none" stroke="#526779" stroke-width="1.6" marker-end="url(#arrow)"/><polyline points="760,650 1040,650" fill="none" stroke="#526779" stroke-width="1.6" stroke-dasharray="6 5" marker-end="url(#arrow)"/><polyline points="1040,726 1320,726" fill="none" stroke="#526779" stroke-width="1.6" stroke-dasharray="6 5" marker-end="url(#arrow)"/><polyline points="1320,802 760,802" fill="none" stroke="#526779" stroke-width="1.6" marker-end="url(#arrow)"/><polyline points="760,878 1320,878" fill="none" stroke="#526779" stroke-width="1.6" stroke-dasharray="6 5" marker-end="url(#arrow)"/><polyline points="1320,954 1600,954" fill="none" stroke="#526779" stroke-width="1.6" marker-end="url(#arrow)"/><polyline points="1320,1030 760,1030" fill="none" stroke="#526779" stroke-width="1.6" marker-end="url(#arrow)"/><polyline points="1600,1106 1665,1106 1665,1132 1600,1132" fill="none" stroke="#526779" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="72" y="140" width="256" height="72" rx="5" fill="#E8F0FE" stroke="#8291A0"/><text font-family="Arial, sans-serif" font-size="15" fill="#202B37" text-anchor="middle"><tspan x="200" y="171.5">Admin / Scheduler</tspan><tspan x="200" y="191">S3 source</tspan></text><rect x="352" y="140" width="256" height="72" rx="5" fill="#E6F4EA" stroke="#8291A0"/><text font-family="Arial, sans-serif" font-size="15" fill="#202B37" text-anchor="middle"><tspan x="480" y="171.5">Import queue</tspan><tspan x="480" y="191">+ worker</tspan></text><rect x="632" y="140" width="256" height="72" rx="5" fill="#E6F4EA" stroke="#8291A0"/><text font-family="Arial, sans-serif" font-size="15" fill="#202B37" text-anchor="middle"><tspan x="760" y="181.25">PostgreSQL</tspan></text><rect x="912" y="140" width="256" height="72" rx="5" fill="#E6F4EA" stroke="#8291A0"/><text font-family="Arial, sans-serif" font-size="15" fill="#202B37" text-anchor="middle"><tspan x="1040" y="171.5">Outbox relay</tspan><tspan x="1040" y="191">EventBridge</tspan></text><rect x="1192" y="140" width="256" height="72" rx="5" fill="#E6F4EA" stroke="#8291A0"/><text font-family="Arial, sans-serif" font-size="15" fill="#202B37" text-anchor="middle"><tspan x="1320" y="171.5">Cache queue</tspan><tspan x="1320" y="191">+ worker</tspan></text><rect x="1472" y="140" width="256" height="72" rx="5" fill="#FCE8E6" stroke="#8291A0"/><text font-family="Arial, sans-serif" font-size="15" fill="#202B37" text-anchor="middle"><tspan x="1600" y="181.25">Valkey / API</tspan></text><rect x="60" y="1197" width="1680" height="72" rx="5" fill="#F2F4F7" stroke="#8291A0"/><text font-family="Arial, sans-serif" font-size="15" fill="#202B37" text-anchor="middle"><tspan x="900" y="1228.5">Duplicates and older events are harmless. Failed jobs retry, then DLQ. Reconcile DB/cache versions.</tspan><tspan x="900" y="1248">Checkout always revalidates live prices and stock; price changes require customer acceptance.</tspan></text><text font-family="Arial, sans-serif" font-size="28" fill="#202B37" font-weight="700"><tspan x="49" y="55.8">03  Catalog and Price Publication</tspan></text><text font-family="Arial, sans-serif" font-size="16" fill="#202B37"><tspan x="49" y="103.1">Database commit precedes cache publication | Outbox + at-least-once processing | Versioned releases</tspan></text><text font-family="Arial, sans-serif" font-size="13" fill="#202B37"><tspan x="220" y="247.55">1. Submit source version + job ID</tspan></text><text font-family="Arial, sans-serif" font-size="13" fill="#202B37"><tspan x="363" y="326.55">2. Deduplicate, validate, stage</tspan></text><text font-family="Arial, sans-serif" font-size="13" fill="#202B37"><tspan x="500" y="391.1">3. Activate release + outbox in</tspan><tspan x="500" y="408">one transaction</tspan></text><text font-family="Arial, sans-serif" font-size="13" fill="#202B37"><tspan x="500" y="467.1">4. Committed version; cache</tspan><tspan x="500" y="484">pending</tspan></text><text font-family="Arial, sans-serif" font-size="13" fill="#202B37"><tspan x="780" y="551.55">5. Claim committed outbox entries</tspan></text><text font-family="Arial, sans-serif" font-size="13" fill="#202B37"><tspan x="780" y="627.55">6. CatalogPublished(version)</tspan></text><text font-family="Arial, sans-serif" font-size="13" fill="#202B37"><tspan x="1060" y="695.1">7. Publish; acknowledge only</tspan><tspan x="1060" y="712">successful entries</tspan></text><text font-family="Arial, sans-serif" font-size="13" fill="#202B37"><tspan x="780" y="779.55">8. Load authoritative release</tspan></text><text font-family="Arial, sans-serif" font-size="13" fill="#202B37"><tspan x="780" y="855.55">9. Products, prices and visibility</tspan></text><text font-family="Arial, sans-serif" font-size="13" fill="#202B37"><tspan x="1340" y="923.1">10. Build immutable views; CAS</tspan><tspan x="1340" y="940">newer pointer</tspan></text><text font-family="Arial, sans-serif" font-size="13" fill="#202B37"><tspan x="780" y="1007.55">11. Record cache publication status</tspan></text><text font-family="Arial, sans-serif" font-size="13" fill="#202B37"><tspan x="1483" y="1078.1">12. Read cache; bounded DB</tspan><tspan x="1483" y="1095">fallback</tspan></text></svg>