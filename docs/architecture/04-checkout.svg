<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1530" viewBox="0 0 1800 1530"><title>04  Checkout, Payment and Fulfillment</title><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,4 L0,8 Z" fill="#526779"/></marker></defs><rect width="100%" height="100%" fill="white"/><polyline points="200,212 200,1405" fill="none" stroke="#526779" stroke-width="1.6" stroke-dasharray="6 5"/><polyline points="480,212 480,1405" fill="none" stroke="#526779" stroke-width="1.6" stroke-dasharray="6 5"/><polyline points="760,212 760,1405" fill="none" stroke="#526779" stroke-width="1.6" stroke-dasharray="6 5"/><polyline points="1040,212 1040,1405" fill="none" stroke="#526779" stroke-width="1.6" stroke-dasharray="6 5"/><polyline points="1320,212 1320,1405" fill="none" stroke="#526779" stroke-width="1.6" stroke-dasharray="6 5"/><polyline points="1600,212 1600,1405" fill="none" stroke="#526779" stroke-width="1.6" stroke-dasharray="6 5"/><polyline points="200,270 480,270" fill="none" stroke="#526779" stroke-width="1.6" marker-end="url(#arrow)"/><polyline points="480,346 760,346" fill="none" stroke="#526779" stroke-width="1.6" marker-end="url(#arrow)"/><polyline points="480,422 1040,422" fill="none" stroke="#526779" stroke-width="1.6" marker-end="url(#arrow)"/><polyline points="1040,498 480,498" fill="none" stroke="#526779" stroke-width="1.6" stroke-dasharray="6 5" marker-end="url(#arrow)"/><polyline points="480,574 760,574" fill="none" stroke="#526779" stroke-width="1.6" marker-end="url(#arrow)"/><polyline points="480,650 200,650" fill="none" stroke="#526779" stroke-width="1.6" stroke-dasharray="6 5" marker-end="url(#arrow)"/><polyline points="200,726 1040,726" fill="none" stroke="#526779" stroke-width="1.6" marker-end="url(#arrow)"/><polyline points="1040,802 480,802" fill="none" stroke="#526779" stroke-width="1.6" stroke-dasharray="6 5" marker-end="url(#arrow)"/><polyline points="480,878 760,878" fill="none" stroke="#526779" stroke-width="1.6" marker-end="url(#arrow)"/><polyline points="480,954 1040,954" fill="none" stroke="#526779" stroke-width="1.6" stroke-dasharray="6 5" marker-end="url(#arrow)"/><polyline points="1320,1030 760,1030" fill="none" stroke="#526779" stroke-width="1.6" marker-end="url(#arrow)"/><polyline points="1320,1106 1600,1106" fill="none" stroke="#526779" stroke-width="1.6" stroke-dasharray="6 5" marker-end="url(#arrow)"/><polyline points="1600,1182 1320,1182" fill="none" stroke="#526779" stroke-width="1.6" stroke-dasharray="6 5" marker-end="url(#arrow)"/><polyline points="1320,1258 760,1258" fill="none" stroke="#526779" stroke-width="1.6" marker-end="url(#arrow)"/><polyline points="200,1334 480,1334" fill="none" stroke="#526779" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="72" y="140" width="256" height="72" rx="5" fill="#E8F0FE" stroke="#8291A0"/><text font-family="Arial, sans-serif" font-size="15" fill="#202B37" text-anchor="middle"><tspan x="200" y="181.25">Web / Android / iOS</tspan></text><rect x="352" y="140" width="256" height="72" rx="5" fill="#E6F4EA" stroke="#8291A0"/><text font-family="Arial, sans-serif" font-size="15" fill="#202B37" text-anchor="middle"><tspan x="480" y="181.25">Commerce API</tspan></text><rect x="632" y="140" width="256" height="72" rx="5" fill="#E6F4EA" stroke="#8291A0"/><text font-family="Arial, sans-serif" font-size="15" fill="#202B37" text-anchor="middle"><tspan x="760" y="181.25">PostgreSQL</tspan></text><rect x="912" y="140" width="256" height="72" rx="5" fill="#E6F4EA" stroke="#8291A0"/><text font-family="Arial, sans-serif" font-size="15" fill="#202B37" text-anchor="middle"><tspan x="1040" y="181.25">Razorpay</tspan></text><rect x="1192" y="140" width="256" height="72" rx="5" fill="#E6F4EA" stroke="#8291A0"/><text font-family="Arial, sans-serif" font-size="15" fill="#202B37" text-anchor="middle"><tspan x="1320" y="171.5">Inbox / outbox</tspan><tspan x="1320" y="191">+ workers</tspan></text><rect x="1472" y="140" width="256" height="72" rx="5" fill="#FCE8E6" stroke="#8291A0"/><text font-family="Arial, sans-serif" font-size="15" fill="#202B37" text-anchor="middle"><tspan x="1600" y="181.25">Fulfillment provider</tspan></text><rect x="60" y="1425" width="1680" height="72" rx="5" fill="#F2F4F7" stroke="#8291A0"/><text font-family="Arial, sans-serif" font-size="15" fill="#202B37" text-anchor="middle"><tspan x="900" y="1456.5">Do not dispatch on browser success alone. Duplicate/out-of-order events cannot repeat effects.</tspan><tspan x="900" y="1476">Late payment after stock expiry: recheck stock or compensate. Provider timeout: reconcile before retry.</tspan></text><text font-family="Arial, sans-serif" font-size="28" fill="#202B37" font-weight="700"><tspan x="49" y="55.8">04  Checkout, Payment and Fulfillment</tspan></text><text font-family="Arial, sans-serif" font-size="16" fill="#202B37"><tspan x="49" y="103.1">Customers pay on Wellisha | Captured payment evidence drives order confirmation | External outcomes may be pending</tspan></text><text font-family="Arial, sans-serif" font-size="13" fill="#202B37"><tspan x="220" y="239.1">1. Create order: quote +</tspan><tspan x="220" y="256">idempotency key</tspan></text><text font-family="Arial, sans-serif" font-size="13" fill="#202B37"><tspan x="500" y="315.1">2. Reprice; reserve stock; persist</tspan><tspan x="500" y="332">pending order</tspan></text><text font-family="Arial, sans-serif" font-size="13" fill="#202B37"><tspan x="500" y="399.55">3. Create payment order outside DB transaction</tspan></text><text font-family="Arial, sans-serif" font-size="13" fill="#202B37"><tspan x="500" y="475.55">4. Provider order ID or unknown outcome</tspan></text><text font-family="Arial, sans-serif" font-size="13" fill="#202B37"><tspan x="500" y="543.1">5. Persist payment mapping;</tspan><tspan x="500" y="560">unknown -&gt; reconcile</tspan></text><text font-family="Arial, sans-serif" font-size="13" fill="#202B37"><tspan x="220" y="627.55">6. Checkout details or 202 pending</tspan></text><text font-family="Arial, sans-serif" font-size="13" fill="#202B37"><tspan x="220" y="703.55">7. Customer completes payment</tspan></text><text font-family="Arial, sans-serif" font-size="13" fill="#202B37"><tspan x="500" y="779.55">8. Signed captured-payment webhook</tspan></text><text font-family="Arial, sans-serif" font-size="13" fill="#202B37"><tspan x="500" y="847.1">9. Verify signature; persist</tspan><tspan x="500" y="864">unique inbox</tspan></text><text font-family="Arial, sans-serif" font-size="13" fill="#202B37"><tspan x="500" y="931.55">10. Acknowledge durable receipt</tspan></text><text font-family="Arial, sans-serif" font-size="13" fill="#202B37"><tspan x="780" y="1007.55">11. Validate payment binding; paid + outbox transaction</tspan></text><text font-family="Arial, sans-serif" font-size="13" fill="#202B37"><tspan x="1340" y="1075.1">12. Book shipment after</tspan><tspan x="1340" y="1092">packed-ready</tspan></text><text font-family="Arial, sans-serif" font-size="13" fill="#202B37"><tspan x="1340" y="1151.1">13. Accepted / status / ambiguous</tspan><tspan x="1340" y="1168">result</tspan></text><text font-family="Arial, sans-serif" font-size="13" fill="#202B37"><tspan x="780" y="1235.55">14. Persist tracking; reconcile; notification outbox</tspan></text><text font-family="Arial, sans-serif" font-size="13" fill="#202B37"><tspan x="220" y="1303.1">15. Read order, payment and</tspan><tspan x="220" y="1320">shipment status</tspan></text></svg>