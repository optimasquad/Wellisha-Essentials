<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1302" viewBox="0 0 1800 1302"><title>05  Agent Cancellation and Refund</title><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,4 L0,8 Z" fill="#526779"/></marker></defs><rect width="100%" height="100%" fill="white"/><polyline points="200,212 200,1177" fill="none" stroke="#526779" stroke-width="1.6" stroke-dasharray="6 5"/><polyline points="480,212 480,1177" fill="none" stroke="#526779" stroke-width="1.6" stroke-dasharray="6 5"/><polyline points="760,212 760,1177" fill="none" stroke="#526779" stroke-width="1.6" stroke-dasharray="6 5"/><polyline points="1040,212 1040,1177" fill="none" stroke="#526779" stroke-width="1.6" stroke-dasharray="6 5"/><polyline points="1320,212 1320,1177" fill="none" stroke="#526779" stroke-width="1.6" stroke-dasharray="6 5"/><polyline points="1600,212 1600,1177" fill="none" stroke="#526779" stroke-width="1.6" stroke-dasharray="6 5"/><polyline points="200,270 760,270" fill="none" stroke="#526779" stroke-width="1.6" marker-end="url(#arrow)"/><polyline points="480,346 760,346" fill="none" stroke="#526779" stroke-width="1.6" marker-end="url(#arrow)"/><polyline points="480,422 760,422" fill="none" stroke="#526779" stroke-width="1.6" marker-end="url(#arrow)"/><polyline points="760,498 1040,498" fill="none" stroke="#526779" stroke-width="1.6" marker-end="url(#arrow)"/><polyline points="760,574 480,574" fill="none" stroke="#526779" stroke-width="1.6" stroke-dasharray="6 5" marker-end="url(#arrow)"/><polyline points="1040,650 1320,650" fill="none" stroke="#526779" stroke-width="1.6" stroke-dasharray="6 5" marker-end="url(#arrow)"/><polyline points="1320,726 1040,726" fill="none" stroke="#526779" stroke-width="1.6" stroke-dasharray="6 5" marker-end="url(#arrow)"/><polyline points="1040,802 1105,802 1105,828 1040,828" fill="none" stroke="#526779" stroke-width="1.6" marker-end="url(#arrow)"/><polyline points="1040,878 1600,878" fill="none" stroke="#526779" stroke-width="1.6" stroke-dasharray="6 5" marker-end="url(#arrow)"/><polyline points="1600,954 760,954" fill="none" stroke="#526779" stroke-width="1.6" stroke-dasharray="6 5" marker-end="url(#arrow)"/><polyline points="760,1030 1040,1030" fill="none" stroke="#526779" stroke-width="1.6" marker-end="url(#arrow)"/><polyline points="200,1106 760,1106" fill="none" stroke="#526779" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="72" y="140" width="256" height="72" rx="5" fill="#E8F0FE" stroke="#8291A0"/><text font-family="Arial, sans-serif" font-size="15" fill="#202B37" text-anchor="middle"><tspan x="200" y="181.25">Customer app</tspan></text><rect x="352" y="140" width="256" height="72" rx="5" fill="#E6F4EA" stroke="#8291A0"/><text font-family="Arial, sans-serif" font-size="15" fill="#202B37" text-anchor="middle"><tspan x="480" y="171.5">Support agent</tspan><tspan x="480" y="191">Staff console</tspan></text><rect x="632" y="140" width="256" height="72" rx="5" fill="#E6F4EA" stroke="#8291A0"/><text font-family="Arial, sans-serif" font-size="15" fill="#202B37" text-anchor="middle"><tspan x="760" y="181.25">Commerce API</tspan></text><rect x="912" y="140" width="256" height="72" rx="5" fill="#E6F4EA" stroke="#8291A0"/><text font-family="Arial, sans-serif" font-size="15" fill="#202B37" text-anchor="middle"><tspan x="1040" y="171.5">DB inbox/outbox</tspan><tspan x="1040" y="191">+ queue workers</tspan></text><rect x="1192" y="140" width="256" height="72" rx="5" fill="#E6F4EA" stroke="#8291A0"/><text font-family="Arial, sans-serif" font-size="15" fill="#202B37" text-anchor="middle"><tspan x="1320" y="181.25">Fulfillment provider</tspan></text><rect x="1472" y="140" width="256" height="72" rx="5" fill="#FCE8E6" stroke="#8291A0"/><text font-family="Arial, sans-serif" font-size="15" fill="#202B37" text-anchor="middle"><tspan x="1600" y="181.25">Razorpay</tspan></text><rect x="60" y="1197" width="1680" height="72" rx="5" fill="#F2F4F7" stroke="#8291A0"/><text font-family="Arial, sans-serif" font-size="15" fill="#202B37" text-anchor="middle"><tspan x="900" y="1228.5">Customer call to cancellation API -&gt; 403. A support case never automatically cancels an order.</tspan><tspan x="900" y="1248">Manual provider-portal actions require an agent audit record and verified reconciliation before completion.</tspan></text><text font-family="Arial, sans-serif" font-size="28" fill="#202B37" font-weight="700"><tspan x="49" y="55.8">05  Agent Cancellation and Refund</tspan></text><text font-family="Arial, sans-serif" font-size="16" fill="#202B37"><tspan x="49" y="103.1">Customers contact support; only authorized agents can cancel | Backend RBAC enforces the restriction</tspan></text><text font-family="Arial, sans-serif" font-size="13" fill="#202B37"><tspan x="220" y="247.55">1. Create support case; no order mutation</tspan></text><text font-family="Arial, sans-serif" font-size="13" fill="#202B37"><tspan x="500" y="315.1">2. Read assigned case; verify</tspan><tspan x="500" y="332">customer/order</tspan></text><text font-family="Arial, sans-serif" font-size="13" fill="#202B37"><tspan x="500" y="391.1">3. Agent cancellation: case +</tspan><tspan x="500" y="408">reason + key</tspan></text><text font-family="Arial, sans-serif" font-size="13" fill="#202B37"><tspan x="780" y="467.1">4. Check agent permission; lock;</tspan><tspan x="780" y="484">record intent</tspan></text><text font-family="Arial, sans-serif" font-size="13" fill="#202B37"><tspan x="500" y="551.55">5. 202 pending cancellation</tspan></text><text font-family="Arial, sans-serif" font-size="13" fill="#202B37"><tspan x="1060" y="619.1">6. Cancel / reconcile in-flight</tspan><tspan x="1060" y="636">submission</tspan></text><text font-family="Arial, sans-serif" font-size="13" fill="#202B37"><tspan x="1060" y="703.55">7. Accepted, rejected or pending</tspan></text><text font-family="Arial, sans-serif" font-size="13" fill="#202B37"><tspan x="923" y="774.1">8. Confirmed cancel -&gt; refund</tspan><tspan x="923" y="791">intent</tspan></text><text font-family="Arial, sans-serif" font-size="13" fill="#202B37"><tspan x="1060" y="855.55">9. Submit deduplicated refund</tspan></text><text font-family="Arial, sans-serif" font-size="13" fill="#202B37"><tspan x="780" y="931.55">10. Signed refund outcome callback</tspan></text><text font-family="Arial, sans-serif" font-size="13" fill="#202B37"><tspan x="780" y="999.1">11. Durable inbox; validate;</tspan><tspan x="780" y="1016">notify customer</tspan></text><text font-family="Arial, sans-serif" font-size="13" fill="#202B37"><tspan x="220" y="1083.55">12. Read tracking and agent-action status</tspan></text></svg>