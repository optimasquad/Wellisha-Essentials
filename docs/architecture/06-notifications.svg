<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1302" viewBox="0 0 1800 1302"><title>06  Asynchronous Email and SMS</title><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,4 L0,8 Z" fill="#526779"/></marker></defs><rect width="100%" height="100%" fill="white"/><polyline points="200,212 200,1177" fill="none" stroke="#526779" stroke-width="1.6" stroke-dasharray="6 5"/><polyline points="480,212 480,1177" fill="none" stroke="#526779" stroke-width="1.6" stroke-dasharray="6 5"/><polyline points="760,212 760,1177" fill="none" stroke="#526779" stroke-width="1.6" stroke-dasharray="6 5"/><polyline points="1040,212 1040,1177" fill="none" stroke="#526779" stroke-width="1.6" stroke-dasharray="6 5"/><polyline points="1320,212 1320,1177" fill="none" stroke="#526779" stroke-width="1.6" stroke-dasharray="6 5"/><polyline points="1600,212 1600,1177" fill="none" stroke="#526779" stroke-width="1.6" stroke-dasharray="6 5"/><polyline points="200,270 480,270" fill="none" stroke="#526779" stroke-width="1.6" marker-end="url(#arrow)"/><polyline points="760,346 480,346" fill="none" stroke="#526779" stroke-width="1.6" marker-end="url(#arrow)"/><polyline points="480,422 760,422" fill="none" stroke="#526779" stroke-width="1.6" stroke-dasharray="6 5" marker-end="url(#arrow)"/><polyline points="760,498 1040,498" fill="none" stroke="#526779" stroke-width="1.6" stroke-dasharray="6 5" marker-end="url(#arrow)"/><polyline points="1040,574 1320,574" fill="none" stroke="#526779" stroke-width="1.6" stroke-dasharray="6 5" marker-end="url(#arrow)"/><polyline points="1320,650 480,650" fill="none" stroke="#526779" stroke-width="1.6" marker-end="url(#arrow)"/><polyline points="1320,726 1600,726" fill="none" stroke="#526779" stroke-width="1.6" marker-end="url(#arrow)"/><polyline points="1600,802 1320,802" fill="none" stroke="#526779" stroke-width="1.6" stroke-dasharray="6 5" marker-end="url(#arrow)"/><polyline points="1320,878 480,878" fill="none" stroke="#526779" stroke-width="1.6" marker-end="url(#arrow)"/><polyline points="1600,954 1040,954" fill="none" stroke="#526779" stroke-width="1.6" stroke-dasharray="6 5" marker-end="url(#arrow)"/><polyline points="1040,1030 1320,1030" fill="none" stroke="#526779" stroke-width="1.6" stroke-dasharray="6 5" marker-end="url(#arrow)"/><polyline points="1320,1106 480,1106" fill="none" stroke="#526779" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="72" y="140" width="256" height="72" rx="5" fill="#E8F0FE" stroke="#8291A0"/><text font-family="Arial, sans-serif" font-size="15" fill="#202B37" text-anchor="middle"><tspan x="200" y="181.25">Commerce transaction</tspan></text><rect x="352" y="140" width="256" height="72" rx="5" fill="#E6F4EA" stroke="#8291A0"/><text font-family="Arial, sans-serif" font-size="15" fill="#202B37" text-anchor="middle"><tspan x="480" y="181.25">DB outbox</tspan></text><rect x="632" y="140" width="256" height="72" rx="5" fill="#E6F4EA" stroke="#8291A0"/><text font-family="Arial, sans-serif" font-size="15" fill="#202B37" text-anchor="middle"><tspan x="760" y="181.25">Relay + EventBridge</tspan></text><rect x="912" y="140" width="256" height="72" rx="5" fill="#E6F4EA" stroke="#8291A0"/><text font-family="Arial, sans-serif" font-size="15" fill="#202B37" text-anchor="middle"><tspan x="1040" y="171.5">Email / SMS queues</tspan><tspan x="1040" y="191">+ DLQs</tspan></text><rect x="1192" y="140" width="256" height="72" rx="5" fill="#E6F4EA" stroke="#8291A0"/><text font-family="Arial, sans-serif" font-size="15" fill="#202B37" text-anchor="middle"><tspan x="1320" y="181.25">Channel workers</tspan></text><rect x="1472" y="140" width="256" height="72" rx="5" fill="#FCE8E6" stroke="#8291A0"/><text font-family="Arial, sans-serif" font-size="15" fill="#202B37" text-anchor="middle"><tspan x="1600" y="181.25">SES / AWS SMS</tspan></text><rect x="60" y="1197" width="1680" height="72" rx="5" fill="#F2F4F7" stroke="#8291A0"/><text font-family="Arial, sans-serif" font-size="15" fill="#202B37" text-anchor="middle"><tspan x="900" y="1228.5">Send acceptance is not delivery. Persistent dedupe limits repeats; ambiguous sends need a defined retry policy.</tspan><tspan x="900" y="1248">SES production access; India SMS entity/template registration; marketing consent is separate.</tspan></text><text font-family="Arial, sans-serif" font-size="28" fill="#202B37" font-weight="700"><tspan x="49" y="55.8">06  Asynchronous Email and SMS</tspan></text><text font-family="Arial, sans-serif" font-size="16" fill="#202B37"><tspan x="49" y="103.1">Notifications never block checkout or fulfillment | Separate channel queues and delivery tracking</tspan></text><text font-family="Arial, sans-serif" font-size="13" fill="#202B37"><tspan x="220" y="239.1">1. Commit business state +</tspan><tspan x="220" y="256">notification event</tspan></text><text font-family="Arial, sans-serif" font-size="13" fill="#202B37"><tspan x="500" y="323.55">2. Claim committed event</tspan></text><text font-family="Arial, sans-serif" font-size="13" fill="#202B37"><tspan x="500" y="399.55">3. Order / shipment / refund event</tspan></text><text font-family="Arial, sans-serif" font-size="13" fill="#202B37"><tspan x="780" y="475.55">4. Fan out to independent channels</tspan></text><text font-family="Arial, sans-serif" font-size="13" fill="#202B37"><tspan x="1060" y="551.55">5. Deliver at least once</tspan></text><text font-family="Arial, sans-serif" font-size="13" fill="#202B37"><tspan x="500" y="627.55">6. Resolve consent/template; record unique send intent</tspan></text><text font-family="Arial, sans-serif" font-size="13" fill="#202B37"><tspan x="1340" y="703.55">7. Send email or registered SMS</tspan></text><text font-family="Arial, sans-serif" font-size="13" fill="#202B37"><tspan x="1340" y="771.1">8. Provider acceptance / message</tspan><tspan x="1340" y="788">ID</tspan></text><text font-family="Arial, sans-serif" font-size="13" fill="#202B37"><tspan x="500" y="855.55">9. Store sent / unknown / failed attempt</tspan></text><text font-family="Arial, sans-serif" font-size="13" fill="#202B37"><tspan x="1060" y="931.55">10. Delivery feedback through event adapter</tspan></text><text font-family="Arial, sans-serif" font-size="13" fill="#202B37"><tspan x="1060" y="1007.55">11. Process receipt / retry / DLQ</tspan></text><text font-family="Arial, sans-serif" font-size="13" fill="#202B37"><tspan x="500" y="1083.55">12. Update delivery outcome; suppress invalid recipients</tspan></text></svg>