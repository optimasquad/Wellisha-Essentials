"none" stroke="#526779" stroke-width="1.6" marker-end="url(#arrow)"/><polyline points="1040,954 1320,954" fill="none" stroke="#526779" stroke-width="1.6" stroke-dasharray="6 5" marker-end="url(#arrow)"/><polyline points="1320,1030 1600,1030" fill="none" stroke="#526779" stroke-width="1.6" stroke-dasharray="6 5" marker-end="url(#arrow)"/><polyline points="1600,1106 1320,1106" fill="none" stroke="#526779" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="72" y="140" width="256" height="72" rx="5" fill="#E8F0FE" stroke="#8291A0"/><text font-family="Arial, sans-serif" font-size="15" fill="#202B37" text-anchor="middle"><tspan x="200" y="181.25">Carrier / fulfillment</tspan></text><rect x="352" y="140" width="256" height="72" rx="5" fill="#E6F4EA" stroke="#8291A0"/><text font-family="Arial, sans-serif" font-size="15" fill="#202B37" text-anchor="middle"><tspan x="480" y="171.5">Webhook API</tspan><tspan x="480" y="191">+ durable inbox</tspan></text><rect x="632" y="140" width="256" height="72" rx="5" fill="#E6F4EA" stroke="#8291A0"/><text font-family="Arial, sans-serif" font-size="15" fill="#202B37" text-anchor="middle"><tspan x="760" y="181.25">Tracking worker</tspan></text><rect x="912" y="140" width="256" height="72" rx="5" fill="#E6F4EA" stroke="#8291A0"/><text font-family="Arial, sans-serif" font-size="15" fill="#202B37" text-anchor="middle"><tspan x="1040" y="181.25">PostgreSQL</tspan></text><rect x="1192" y="140" width="256" height="72" rx="5" fill="#E6F4EA" stroke="#8291A0"/><text font-family="Arial, sans-serif" font-size="15" fill="#202B37" text-anchor="middle"><tspan x="1320" y="181.25">Commerce API</tspan></text><rect x="1472" y="140" width="256" height="72" rx="5" fill="#FCE8E6" stroke="#8291A0"/><text font-family="Arial, sans-serif" font-size="15" fill="#202B37" text-anchor="middle"><tspan x="1600" y="181.25">Customer app</tspan></text><rect x="60" y="1197" width="1680" height="72" rx="5" fill="#F2F4F7" stroke="#8291A0"/><text font-family="Arial, sans-serif" font-size="15" fill="#202B37" text-anchor="middle"><tspan x="900" y="1228.5">No customer cancellation action. Split shipments remain separate; stale data is labeled.</tspan><tspan x="900" y="1248">Do not regress shipment state for late events or expose another customer&apos;s order by tracking ID.</tspan></text><text font-family="Arial, sans-serif" font-size="28" fill="#202B37" font-weight="700"><tspan x="49" y="55.8">07  Customer Delivery Tracking</tspan></text><text font-family="Arial, sans-serif" font-size="16" fill="#202B37"><tspan x="49" y="103.1">One tracking experience across web, Android and iOS | Shipment-level timeline, ETA and last update</tspan></text><text font-family="Arial, sans-serif" font-size="13" fill="#202B37"><tspan x="220" y="247.55">1. Signed shipment event</tspan></text><text font-family="Arial, sans-serif" font-size="13" fill="#202B37"><tspan x="500" y="323.55">2. Verify signature; store unique event</tspan></text><text font-family="Arial, sans-serif" font-size="13" fill="#202B37"><tspan x="220" y="399.55">3. Acknowledge durable receipt</tspan></text><text font-family="Arial, sans-serif" font-size="13" fill="#202B37"><tspan x="780" y="475.55">4. Claim inbox event; deduplicate</tspan></text><text font-family="Arial, sans-serif" font-size="13" fill="#202B37"><tspan x="780" y="543.1">5. Normalize status; persist</tspan><tspan x="780" y="560">timeline + outbox</tspan></text><text font-family="Arial, sans-serif" font-size="13" fill="#202B37"><tspan x="220" y="627.55">6. Scheduled polling for missing/stale events</tspan></text><text font-family="Arial, sans-serif" font-size="13" fill="#202B37"><tspan x="220" y="703.55">7. Current provider shipment state</tspan></text><text font-family="Arial, sans-serif" font-size="13" fill="#202B37"><tspan x="1340" y="771.1">8. GET own order tracking; access</tspan><tspan x="1340" y="788">token</tspan></text><text font-family="Arial, sans-serif" font-size="13" fill="#202B37"><tspan x="1060" y="847.1">9. Check ownership; read each</tspan><tspan x="1060" y="864">shipment</tspan></text><text font-family="Arial, sans-serif" font-size="13" fill="#202B37"><tspan x="1060" y="923.1">10. Timeline, ETA, last update,</tspan><tspan x="1060" y="940">exceptions</tspan></text><text font-family="Arial, sans-serif" font-size="13" fill="#202B37"><tspan x="1340" y="999.1">11. Tracking view; contact-support</tspan><tspan x="1340" y="1016">link</tspan></text><text font-family="Arial, sans-serif" font-size="13" fill="#202B37"><tspan x="1340" y="1075.1">12. Refresh with ETag; back off</tspan><tspan x="1340" y="1092">offline</tspan></text></svg>