<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1020" viewBox="0 0 1800 1020"><title>08  Booking</title><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,4 L0,8 Z" fill="#526779"/></marker></defs><rect width="100%" height="100%" fill="white"/><polyline points="340,250 400,250" fill="none" stroke="#526779" stroke-width="1.6" marker-end="url(#arrow)"/><polyline points="680,250 740,250" fill="none" stroke="#526779" stroke-width="1.6" marker-end="url(#arrow)"/><polyline points="1020,250 1080,250" fill="none" stroke="#526779" stroke-width="1.6" marker-end="url(#arrow)"/><polyline points="1360,250 1420,250" fill="none" stroke="#526779" stroke-width="1.6" marker-end="url(#arrow)"/><polyline points="1560,300 1560,430" fill="none" stroke="#526779" stroke-width="1.6" marker-end="url(#arrow)"/><polyline points="1420,480 1360,480" fill="none" stroke="#526779" stroke-width="1.6" marker-end="url(#arrow)"/><polyline points="1080,480 1020,480" fill="none" stroke="#526779" stroke-width="1.6" marker-end="url(#arrow)"/><polyline points="740,480 680,480" fill="none" stroke="#526779" stroke-width="1.6" marker-end="url(#arrow)"/><polyline points="400,480 340,480" fill="none" stroke="#526779" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="60" y="200" width="280" height="100" rx="5" fill="#E8F0FE" stroke="#8291A0"/><text font-family="Arial, sans-serif" font-size="15" fill="#202B37" text-anchor="middle"><tspan x="200" y="245.5">Web / Android / iOS</tspan><tspan x="200" y="265">Browse and sign in</tspan></text><rect x="400" y="200" width="280" height="100" rx="5" fill="#E6F4EA" stroke="#8291A0"/><text font-family="Arial, sans-serif" font-size="15" fill="#202B37" text-anchor="middle"><tspan x="540" y="245.5">Cognito federation</tspan><tspan x="540" y="265">Google, Microsoft, Apple</tspan></text><rect x="740" y="200" width="280" height="100" rx="5" fill="#E6F4EA" stroke="#8291A0"/><text font-family="Arial, sans-serif" font-size="15" fill="#202B37" text-anchor="middle"><tspan x="880" y="245.5">Catalog API + Valkey</tspan><tspan x="880" y="265">Listings and current prices</tspan></text><rect x="1080" y="200" width="280" height="100" rx="5" fill="#E6F4EA" stroke="#8291A0"/><text font-family="Arial, sans-serif" font-size="15" fill="#202B37" text-anchor="middle"><tspan x="1220" y="245.5">Cart + delivery address</tspan><tspan x="1220" y="265">Customer-owned resources</tspan></text><rect x="1420" y="200" width="280" height="100" rx="5" fill="#E6F4EA" stroke="#8291A0"/><text font-family="Arial, sans-serif" font-size="15" fill="#202B37" text-anchor="middle"><tspan x="1560" y="245.5">Authoritative quote</tspan><tspan x="1560" y="265">Price, tax, discount, stock</tspan></text><rect x="740" y="430" width="280" height="100" rx="5" fill="#FCE8E6" stroke="#8291A0"/><text font-family="Arial, sans-serif" font-size="15" fill="#202B37" text-anchor="middle"><tspan x="880" y="475.5">Payment details to client</tspan><tspan x="880" y="495">Razorpay hosted checkout</tspan></text><rect x="1080" y="430" width="280" height="100" rx="5" fill="#E6F4EA" stroke="#8291A0"/><text font-family="Arial, sans-serif" font-size="15" fill="#202B37" text-anchor="middle"><tspan x="1220" y="475.5">RDS transaction</tspan><tspan x="1220" y="495">Pending order + reservation</tspan></text><rect x="1420" y="430" width="280" height="100" rx="5" fill="#E6F4EA" stroke="#8291A0"/><text font-family="Arial, sans-serif" font-size="15" fill="#202B37" text-anchor="middle"><tspan x="1560" y="475.5">Customer accepts quote</tspan><tspan x="1560" y="495">Idempotent order request</tspan></text><rect x="400" y="430" width="280" height="100" rx="5" fill="#E6F3F7" stroke="#8291A0"/><text font-family="Arial, sans-serif" font-size="15" fill="#202B37" text-anchor="middle"><tspan x="540" y="465.75">Verified payment webhook</tspan><tspan x="540" y="485.25">Inbox + paid transaction</tspan><tspan x="540" y="504.75">OrderPaid outbox event</tspan></text><rect x="60" y="430" width="280" height="100" rx="5" fill="#E6F3F7" stroke="#8291A0"/><text font-family="Arial, sans-serif" font-size="15" fill="#202B37" text-anchor="middle"><tspan x="200" y="465.75">Post-Booking handoff</tspan><tspan x="200" y="485.25">OrderPaid routed through</tspan><tspan x="200" y="504.75">EventBridge + SQS</tspan></text><rect x="60" y="640" width="1640" height="115" rx="5" fill="#FFF2CC" stroke="#8291A0"/><text font-family="Arial, sans-serif" font-size="15" fill="#202B37" text-anchor="middle"><tspan x="880" y="683.25">Catalog operations</tspan><tspan x="880" y="702.75">Admin / S3 / Scheduler -&gt; import worker -&gt; versioned PostgreSQL release -&gt; outbox -&gt; cache refresh</tspan><tspan x="880" y="722.25">Pricing is computed on the server; stale browser prices require renewed customer acceptance.</tspan></text><rect x="60" y="785" width="1640" height="105" rx="5" fill="#FFF2CC" stroke="#8291A0"/><text font-family="Arial, sans-serif" font-size="15" fill="#202B37" text-anchor="middle"><tspan x="880" y="823.25">Product media</tspan><tspan x="880" y="842.75">Supplied artwork + generated mockups -&gt; review -&gt; S3 masters -&gt; image derivatives / MediaConvert -&gt; CloudFront</tspan><tspan x="880" y="862.25">All three clients consume the same approved media metadata with platform-appropriate sizes.</tspan></text><text font-family="Arial, sans-serif" font-size="28" fill="#202B37" font-weight="700"><tspan x="49" y="55.8">08  Booking</tspan></text><text font-family="Arial, sans-serif" font-size="16" fill="#202B37"><tspan x="49" y="103.1">Miro section A | Customer journey through verified payment | Web, Android and iOS</tspan></text><text font-family="Arial, sans-serif" font-size="16" fill="#202B37"><tspan x="69" y="955.6">Review: catalog source, tax/shipping rules, stock ownership, provider serviceability, identity migration and payment reconciliation.</tspan></text></svg>