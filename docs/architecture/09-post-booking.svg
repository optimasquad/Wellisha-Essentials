<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1140" viewBox="0 0 1800 1140"><title>09  Post-Booking Operations</title><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,4 L0,8 Z" fill="#526779"/></marker></defs><rect width="100%" height="100%" fill="white"/><polyline points="340,240 400,240" fill="none" stroke="#526779" stroke-width="1.6" marker-end="url(#arrow)"/><polyline points="680,240 740,240" fill="none" stroke="#526779" stroke-width="1.6" marker-end="url(#arrow)"/><polyline points="1020,240 1080,240" fill="none" stroke="#526779" stroke-width="1.6" marker-end="url(#arrow)"/><polyline points="1360,240 1420,240" fill="none" stroke="#526779" stroke-width="1.6" marker-end="url(#arrow)"/><polyline points="340,507 400,507" fill="none" stroke="#526779" stroke-width="1.6" marker-end="url(#arrow)"/><polyline points="680,507 740,507" fill="none" stroke="#526779" stroke-width="1.6" marker-end="url(#arrow)"/><polyline points="1020,507 1080,507" fill="none" stroke="#526779" stroke-width="1.6" marker-end="url(#arrow)"/><polyline points="1360,507 1420,507" fill="none" stroke="#526779" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="60" y="190" width="280" height="100" rx="5" fill="#E6F3F7" stroke="#8291A0"/><text font-family="Arial, sans-serif" font-size="15" fill="#202B37" text-anchor="middle"><tspan x="200" y="235.5">OrderPaid event</tspan><tspan x="200" y="255">EventBridge + SQS</tspan></text><rect x="400" y="190" width="280" height="100" rx="5" fill="#E6F3F7" stroke="#8291A0"/><text font-family="Arial, sans-serif" font-size="15" fill="#202B37" text-anchor="middle"><tspan x="540" y="235.5">Fulfillment worker</tspan><tspan x="540" y="255">Idempotent provider adapter</tspan></text><rect x="740" y="190" width="280" height="100" rx="5" fill="#FCE8E6" stroke="#8291A0"/><text font-family="Arial, sans-serif" font-size="15" fill="#202B37" text-anchor="middle"><tspan x="880" y="235.5">Amazon Shipping</tspan><tspan x="880" y="255">Wellisha packs; Amazon delivers</tspan></text><rect x="1080" y="190" width="280" height="100" rx="5" fill="#E6F3F7" stroke="#8291A0"/><text font-family="Arial, sans-serif" font-size="15" fill="#202B37" text-anchor="middle"><tspan x="1220" y="235.5">Tracking inbox + worker</tspan><tspan x="1220" y="255">Normalize provider updates</tspan></text><rect x="1420" y="190" width="280" height="100" rx="5" fill="#E8F0FE" stroke="#8291A0"/><text font-family="Arial, sans-serif" font-size="15" fill="#202B37" text-anchor="middle"><tspan x="1560" y="235.5">Web / Android / iOS</tspan><tspan x="1560" y="255">Timeline, ETA, last update</tspan></text><rect x="60" y="450" width="280" height="115" rx="5" fill="#E8F0FE" stroke="#8291A0"/><text font-family="Arial, sans-serif" font-size="15" fill="#202B37" text-anchor="middle"><tspan x="200" y="503">Customer contacts support</tspan><tspan x="200" y="522.5">Case only; no cancellation</tspan></text><rect x="400" y="450" width="280" height="115" rx="5" fill="#E6F4EA" stroke="#8291A0"/><text font-family="Arial, sans-serif" font-size="15" fill="#202B37" text-anchor="middle"><tspan x="540" y="503">Authorized support agent</tspan><tspan x="540" y="522.5">MFA, role, reason, case ID</tspan></text><rect x="740" y="450" width="280" height="115" rx="5" fill="#E6F4EA" stroke="#8291A0"/><text font-family="Arial, sans-serif" font-size="15" fill="#202B37" text-anchor="middle"><tspan x="880" y="493.25">Cancellation worker</tspan><tspan x="880" y="512.75">Record intent; serialize</tspan><tspan x="880" y="532.25">with shipment submission</tspan></text><rect x="1080" y="450" width="280" height="115" rx="5" fill="#FCE8E6" stroke="#8291A0"/><text font-family="Arial, sans-serif" font-size="15" fill="#202B37" text-anchor="middle"><tspan x="1220" y="503">Provider cancellation</tspan><tspan x="1220" y="522.5">Accepted / rejected / pending</tspan></text><rect x="1420" y="450" width="280" height="115" rx="5" fill="#E6F4EA" stroke="#8291A0"/><text font-family="Arial, sans-serif" font-size="15" fill="#202B37" text-anchor="middle"><tspan x="1560" y="493.25">Refund worker + Razorpay</tspan><tspan x="1560" y="512.75">Only after eligible outcome</tspan><tspan x="1560" y="532.25">Reconcile before completion</tspan></text><rect x="60" y="710" width="1640" height="110" rx="5" fill="#E6F3F7" stroke="#8291A0"/><text font-family="Arial, sans-serif" font-size="15" fill="#202B37" text-anchor="middle"><tspan x="880" y="750.75">Asynchronous customer updates</tspan><tspan x="880" y="770.25">Business outbox -&gt; EventBridge -&gt; separate email/SMS queues -&gt; SES / AWS End User Messaging</tspan><tspan x="880" y="789.75">Order, shipment, support, agent cancellation and refund updates; provider acceptance is not final delivery.</tspan></text><rect x="60" y="865" width="1640" height="110" rx="5" fill="#F2F4F7" stroke="#8291A0"/><text font-family="Arial, sans-serif" font-size="15" fill="#202B37" text-anchor="middle"><tspan x="880" y="905.75">Agent-only control boundary</tspan><tspan x="880" y="925.25">Customer cancellation calls are forbidden by the API. Manual provider-portal actions require an audited case and reconciliation.</tspan><tspan x="880" y="944.75">Separate order, shipment, cancellation and refund states; split shipments and partial refunds remain explicit.</tspan></text><text font-family="Arial, sans-serif" font-size="28" fill="#202B37" font-weight="700"><tspan x="49" y="55.8">09  Post-Booking Operations</tspan></text><text font-family="Arial, sans-serif" font-size="16" fill="#202B37"><tspan x="49" y="103.1">Miro section B | Fulfillment, delivery tracking, support and controlled cancellation</tspan></text><text font-family="Arial, sans-serif" font-size="16" fill="#202B37"><tspan x="69" y="358.1">Tracking is served by the owner-authorized API from durable shipment state; webhooks and polling keep it current.</tspan></text><text font-family="Arial, sans-serif" font-size="16" fill="#202B37"><tspan x="69" y="635.6">Provider rejection or dispatched shipment -&gt; support explains the outcome / eligible return policy. No automatic cancellation from a customer case.</tspan></text><text font-family="Arial, sans-serif" font-size="16" fill="#202B37"><tspan x="69" y="1043.1">Operations: retry budgets, DLQs, provider reconciliation, staff access review, support SLA and refund approval thresholds.</tspan></text></svg>