1600,878" fill="none" stroke="#526779" stroke-width="1.6" stroke-dasharray="6 5" marker-end="url(#arrow)"/><polyline points="1600,954 480,954" fill="none" stroke="#526779" stroke-width="1.6" marker-end="url(#arrow)"/><polyline points="1600,1030 1665,1030 1665,1056 1600,1056" fill="none" stroke="#526779" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="72" y="140" width="256" height="72" rx="5" fill="#E8F0FE" stroke="#8291A0"/><text font-family="Arial, sans-serif" font-size="15" fill="#202B37" text-anchor="middle"><tspan x="200" y="181.25">Merchandising</tspan></text><rect x="352" y="140" width="256" height="72" rx="5" fill="#E6F4EA" stroke="#8291A0"/><text font-family="Arial, sans-serif" font-size="15" fill="#202B37" text-anchor="middle"><tspan x="480" y="181.25">S3 master assets</tspan></text><rect x="632" y="140" width="256" height="72" rx="5" fill="#E6F4EA" stroke="#8291A0"/><text font-family="Arial, sans-serif" font-size="15" fill="#202B37" text-anchor="middle"><tspan x="760" y="171.5">EventBridge / SQS</tspan><tspan x="760" y="191">Media worker</tspan></text><rect x="912" y="140" width="256" height="72" rx="5" fill="#E6F4EA" stroke="#8291A0"/><text font-family="Arial, sans-serif" font-size="15" fill="#202B37" text-anchor="middle"><tspan x="1040" y="171.5">Image processing /</tspan><tspan x="1040" y="191">MediaConvert</tspan></text><rect x="1192" y="140" width="256" height="72" rx="5" fill="#E6F4EA" stroke="#8291A0"/><text font-family="Arial, sans-serif" font-size="15" fill="#202B37" text-anchor="middle"><tspan x="1320" y="181.25">Catalog media records</tspan></text><rect x="1472" y="140" width="256" height="72" rx="5" fill="#FCE8E6" stroke="#8291A0"/><text font-family="Arial, sans-serif" font-size="15" fill="#202B37" text-anchor="middle"><tspan x="1600" y="181.25">CloudFront / clients</tspan></text><rect x="60" y="1121" width="1680" height="72" rx="5" fill="#F2F4F7" stroke="#8291A0"/><text font-family="Arial, sans-serif" font-size="15" fill="#202B37" text-anchor="middle"><tspan x="900" y="1152.5">Generated packaging is a mockup until approved. No processing loop: source and derivative prefixes differ.</tspan><tspan x="900" y="1172">Only public product media is CDN-readable; invoices, imports and customer data remain private.</tspan></text><text font-family="Arial, sans-serif" font-size="28" fill="#202B37" font-weight="700"><tspan x="49" y="55.8">10  Product Media Publication</tspan></text><text font-family="Arial, sans-serif" font-size="16" fill="#202B37"><tspan x="49" y="103.1">Approved product identity across web, Android and iOS | Originals preserved; delivery assets versioned</tspan></text><text font-family="Arial, sans-serif" font-size="13" fill="#202B37"><tspan x="220" y="239.1">1. Upload original / generated</tspan><tspan x="220" y="256">review master</tspan></text><text font-family="Arial, sans-serif" font-size="13" fill="#202B37"><tspan x="500" y="315.1">2. Object-created event + asset</tspan><tspan x="500" y="332">version</tspan></text><text font-family="Arial, sans-serif" font-size="13" fill="#202B37"><tspan x="643" y="394.1">3. Validate type, size, metadata;</tspan><tspan x="643" y="411">deduplicate</tspan></text><text font-family="Arial, sans-serif" font-size="13" fill="#202B37"><tspan x="780" y="467.1">4. Create bounded image/video</tspan><tspan x="780" y="484">derivatives</tspan></text><text font-family="Arial, sans-serif" font-size="13" fill="#202B37"><tspan x="500" y="551.55">5. Write derivatives to separate output prefix</tspan></text><text font-family="Arial, sans-serif" font-size="13" fill="#202B37"><tspan x="780" y="627.55">6. Completion / failure event</tspan></text><text font-family="Arial, sans-serif" font-size="13" fill="#202B37"><tspan x="780" y="703.55">7. Record ready variants; still unpublished</tspan></text><text font-family="Arial, sans-serif" font-size="13" fill="#202B37"><tspan x="220" y="779.55">8. Review branding, labels, video; approve version</tspan></text><text font-family="Arial, sans-serif" font-size="13" fill="#202B37"><tspan x="1340" y="847.1">9. Publish immutable URLs +</tspan><tspan x="1340" y="864">dimensions + alt text</tspan></text><text font-family="Arial, sans-serif" font-size="13" fill="#202B37"><tspan x="500" y="931.55">10. Fetch approved derivative through origin access</tspan></text><text font-family="Arial, sans-serif" font-size="13" fill="#202B37"><tspan x="1483" y="1002.1">11. Choose viewport size /</tspan><tspan x="1483" y="1019">supported video format</tspan></text></svg>