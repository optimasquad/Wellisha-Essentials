<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="660" viewBox="0 0 1100 660" role="img" aria-labelledby="title desc">
<title id="title">Wellisha simple commerce lifecycle</title><desc id="desc">Customer reviews a quote, confirms an order and pays. Verified capture enables packing, shipping and notifications. Refunds and cancellations are independent.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#475569"/></marker></defs>
<rect width="1100" height="660" rx="18" fill="#f8fafc"/>
<g font-family="Arial,sans-serif" fill="#0f172a"><text x="40" y="48" font-size="27" font-weight="bold">Wellisha: clear steps, durable decisions</text><text x="40" y="80" font-size="16">API prices and simple offers • prepacked kits have their own SKU and stock</text>
<g fill="#fff" stroke="#94a3b8" stroke-width="2"><rect x="40" y="120" width="225" height="105" rx="12"/><rect x="315" y="120" width="225" height="105" rx="12"/><rect x="590" y="120" width="225" height="105" rx="12"/><rect x="865" y="120" width="195" height="105" rx="12"/><rect x="315" y="330" width="225" height="100" rx="12"/><rect x="590" y="330" width="225" height="100" rx="12"/><rect x="865" y="330" width="195" height="100" rx="12"/></g>
<g font-size="19" font-weight="bold"><text x="58" y="153">Review current quote</text><text x="333" y="153">Confirm this total</text><text x="608" y="153">Create payment</text><text x="883" y="153">Verify capture</text><text x="333" y="363">Pack actual parcel</text><text x="608" y="363">Book shipment</text><text x="883" y="363">Track and notify</text></g>
<g font-size="15"><text x="58" y="185">Owned address + API prices</text><text x="58" y="207">No stock reservation yet</text><text x="333" y="185">Recheck versions and stock</text><text x="333" y="207">One order + timed reservation</text><text x="608" y="185">Durable provider binding</text><text x="608" y="207">One POST; review outcome</text><text x="883" y="185">Signed webhook / GET</text><text x="883" y="207">Exact order + amount</text><text x="333" y="395">Staff confirms packed-ready</text><text x="333" y="417">No duplicated item allocation</text><text x="608" y="395">Record booking before label</text><text x="608" y="417">Recover label; never rebook</text><text x="883" y="395">Private labels + events</text><text x="883" y="417">Verified contacts + opt-in</text></g>
<g fill="none" stroke="#475569" stroke-width="2.5" marker-end="url(#arrow)"><path d="M265 172H310"/><path d="M540 172H585"/><path d="M815 172H860"/><path d="M962 225V270H427V325"/><path d="M540 380H585"/><path d="M815 380H860"/></g>
<text x="635" y="259" font-size="15" fill="#166534">Timely capture authorizes packing</text>
<rect x="40" y="475" width="1020" height="145" rx="12" fill="#fff7ed" stroke="#fdba74"/>
<text x="60" y="508" font-size="20" font-weight="bold">Exceptions stay explicit</text><g font-size="16"><text x="60" y="537">Changed or expired quote → review again. Unpaid expiry → release once. Late payment → manual review.</text><text x="60" y="566">Refund → staff reason + captured-money limit. Carrier cancellation → separate physical-shipment action.</text><text x="60" y="595">Unknown provider outcome → investigate and reconcile; automatic retries cannot repeat external side effects.</text></g></g></svg>
