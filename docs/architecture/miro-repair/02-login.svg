<svg xmlns="http://www.w3.org/2000/svg" width="3200" height="3840" viewBox="0 0 3200 3840"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10" fill="#313131"/></marker></defs><rect width="100%" height="100%" fill="white"/><text font-family="Arial" font-size="67" fill="#1a1a1a" font-weight="bold"><tspan x="64" y="131">02. Federated Login</tspan></text><text font-family="Arial" font-size="33" fill="#1a1a1a"><tspan x="64" y="217">Common identity for web, Android and iOS  /  Public mobile client uses PKCE; web uses a session BFF</tspan></text><line x1="288" y1="448" x2="288" y2="3456" stroke="#b0b0b0" stroke-dasharray="5 5"/><line x1="800" y1="448" x2="800" y2="3456" stroke="#b0b0b0" stroke-dasharray="5 5"/><line x1="1312" y1="448" x2="1312" y2="3456" stroke="#b0b0b0" stroke-dasharray="5 5"/><line x1="1824" y1="448" x2="1824" y2="3456" stroke="#b0b0b0" stroke-dasharray="5 5"/><line x1="2336" y1="448" x2="2336" y2="3456" stroke="#b0b0b0" stroke-dasharray="5 5"/><line x1="2848" y1="448" x2="2848" y2="3456" stroke="#b0b0b0" stroke-dasharray="5 5"/><polyline points="292,640 796,640" fill="none" stroke="#313131" stroke-width="2" marker-end="url(#arrow)"/><polyline points="804,832 1308,832" fill="none" stroke="#313131" stroke-width="2" marker-end="url(#arrow)"/><polyline points="1316,1024 1820,1024" fill="none" stroke="#313131" stroke-width="2" marker-end="url(#arrow)"/><polyline points="1820,1216 1316,1216" fill="none" stroke="#313131" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="5 5"/><polyline points="1308,1408 804,1408" fill="none" stroke="#313131" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="5 5"/><polyline points="804,1600 1308,1600" fill="none" stroke="#313131" stroke-width="2" marker-end="url(#arrow)"/><polyline points="1308,1792 804,1792" fill="none" stroke="#313131" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="5 5"/><polyline points="804,1984 2332,1984" fill="none" stroke="#313131" stroke-width="2" marker-end="url(#arrow)"/><polyline points="2340,2368 2844,2368" fill="none" stroke="#313131" stroke-width="2" marker-end="url(#arrow)"/><polyline points="2844,2560 2340,2560" fill="none" stroke="#313131" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="5 5"/><polyline points="2332,2752 804,2752" fill="none" stroke="#313131" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="5 5"/><rect x="64" y="288" width="448" height="160" rx="0" fill="#9CE6FF" stroke="#2C97BB" stroke-width="2"/><text font-family="Arial" font-size="33" fill="#1a1a1a"><tspan x="88" y="377.5">Customer</tspan></text><rect x="576" y="288" width="448" height="160" rx="0" fill="#9CE6FF" stroke="#2C97BB" stroke-width="2"/><text font-family="Arial" font-size="33" fill="#1a1a1a"><tspan x="600" y="377.5">Web BFF / Native app</tspan></text><rect x="1088" y="288" width="448" height="160" rx="0" fill="#9CE6FF" stroke="#2C97BB" stroke-width="2"/><text font-family="Arial" font-size="33" fill="#1a1a1a"><tspan x="1112" y="377.5">Cognito</tspan></text><rect x="1600" y="288" width="448" height="160" rx="0" fill="#9CE6FF" stroke="#2C97BB" stroke-width="2"/><text font-family="Arial" font-size="33" fill="#1a1a1a"><tspan x="1624" y="354">Google / Microsoft /</tspan><tspan x="1624" y="400.2">Apple</tspan></text><rect x="2112" y="288" width="448" height="160" rx="0" fill="#9CE6FF" stroke="#2C97BB" stroke-width="2"/><text font-family="Arial" font-size="33" fill="#1a1a1a"><tspan x="2136" y="377.5">Commerce API</tspan></text><rect x="2624" y="288" width="448" height="160" rx="0" fill="#9CE6FF" stroke="#2C97BB" stroke-width="2"/><text font-family="Arial" font-size="33" fill="#1a1a1a"><tspan x="2648" y="377.5">PostgreSQL</tspan></text><rect x="2112" y="2024" width="448" height="160" rx="0" fill="#FFE86D" stroke="#A28E26" stroke-width="2"/><text font-family="Arial" font-size="33" fill="#1a1a1a"><tspan x="2136" y="2090">9. Validate JWT,</tspan><tspan x="2136" y="2136.2">scopes, role</tspan></text><text font-family="Arial" font-size="33" fill="#1a1a1a"><tspan x="308" y="521">1. Choose provider</tspan></text><text font-family="Arial" font-size="33" fill="#1a1a1a"><tspan x="820" y="713">2. Authorize: state,</tspan><tspan x="820" y="759.2">nonce, PKCE</tspan></text><text font-family="Arial" font-size="33" fill="#1a1a1a"><tspan x="1332" y="905">3. Federated sign-in</tspan></text><text font-family="Arial" font-size="33" fill="#1a1a1a"><tspan x="1332" y="1097">4. Validated provider</tspan><tspan x="1332" y="1143.2">response</tspan></text><text font-family="Arial" font-size="33" fill="#1a1a1a"><tspan x="820" y="1289">5. Authorization code</tspan></text><text font-family="Arial" font-size="33" fill="#1a1a1a"><tspan x="820" y="1481">6. Exchange code +</tspan><tspan x="820" y="1527.2">verifier</tspan></text><text font-family="Arial" font-size="33" fill="#1a1a1a"><tspan x="820" y="1673">7. Access token + refresh</tspan><tspan x="820" y="1719.2">token</tspan></text><text font-family="Arial" font-size="33" fill="#1a1a1a"><tspan x="820" y="1865">8. Call API with access token</tspan></text><text font-family="Arial" font-size="33" fill="#1a1a1a"><tspan x="2356" y="2249">10. Resolve issuer/subject</tspan><tspan x="2356" y="2295.2">identity; check resource</tspan><tspan x="2356" y="2341.4">owner</tspan></text><text font-family="Arial" font-size="33" fill="#1a1a1a"><tspan x="2356" y="2441">11. Customer and</tspan><tspan x="2356" y="2487.2">authorization context</tspan></text><text font-family="Arial" font-size="33" fill="#1a1a1a"><tspan x="820" y="2633">12. Authorized response</tspan></text><text font-family="Arial" font-size="33" fill="#1a1a1a"><tspan x="64" y="3553">Web: Secure HttpOnly session; tokens stay server-side. Native: system browser and secure token storage. Test personal Outlook and organization tenants; link identities</tspan><tspan x="64" y="3599.2">only after verified proof of ownership.</tspan></text></svg>