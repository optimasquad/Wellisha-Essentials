<svg xmlns="http://www.w3.org/2000/svg" width="3200" height="3840" viewBox="0 0 3200 3840"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10" fill="#313131"/></marker></defs><rect width="100%" height="100%" fill="white"/><text font-family="Arial" font-size="67" fill="#1a1a1a" font-weight="bold"><tspan x="64" y="131">03. Catalog and Price Publication</tspan></text><text font-family="Arial" font-size="33" fill="#1a1a1a"><tspan x="64" y="217">Database commit precedes cache publication  /  Outbox + at-least-once processing  /  Versioned releases</tspan></text><line x1="288" y1="448" x2="288" y2="3456" stroke="#b0b0b0" stroke-dasharray="5 5"/><line x1="800" y1="448" x2="800" y2="3456" stroke="#b0b0b0" stroke-dasharray="5 5"/><line x1="1312" y1="448" x2="1312" y2="3456" stroke="#b0b0b0" stroke-dasharray="5 5"/><line x1="1824" y1="448" x2="1824" y2="3456" stroke="#b0b0b0" stroke-dasharray="5 5"/><line x1="2336" y1="448" x2="2336" y2="3456" stroke="#b0b0b0" stroke-dasharray="5 5"/><line x1="2848" y1="448" x2="2848" y2="3456" stroke="#b0b0b0" stroke-dasharray="5 5"/><polyline points="292,640 796,640" fill="none" stroke="#313131" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="5 5"/><polyline points="804,1024 1308,1024" fill="none" stroke="#313131" stroke-width="2" marker-end="url(#arrow)"/><polyline points="1308,1216 804,1216" fill="none" stroke="#313131" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="5 5"/><polyline points="1820,1408 1316,1408" fill="none" stroke="#313131" stroke-width="2" marker-end="url(#arrow)"/><polyline points="1316,1600 1820,1600" fill="none" stroke="#313131" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="5 5"/><polyline points="1828,1792 2332,1792" fill="none" stroke="#313131" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="5 5"/><polyline points="2332,1984 1316,1984" fill="none" stroke="#313131" stroke-width="2" marker-end="url(#arrow)"/><polyline points="1316,2176 2332,2176" fill="none" stroke="#313131" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="5 5"/><polyline points="2340,2368 2844,2368" fill="none" stroke="#313131" stroke-width="2" marker-end="url(#arrow)"/><polyline points="2332,2560 1316,2560" fill="none" stroke="#313131" stroke-width="2" marker-end="url(#arrow)"/><rect x="64" y="288" width="448" height="160" rx="0" fill="#9CE6FF" stroke="#2C97BB" stroke-width="2"/><text font-family="Arial" font-size="33" fill="#1a1a1a"><tspan x="88" y="354">Admin / Scheduler S3</tspan><tspan x="88" y="400.2">source</tspan></text><rect x="576" y="288" width="448" height="160" rx="0" fill="#9CE6FF" stroke="#2C97BB" stroke-width="2"/><text font-family="Arial" font-size="33" fill="#1a1a1a"><tspan x="600" y="377.5">Import queue + worker</tspan></text><rect x="1088" y="288" width="448" height="160" rx="0" fill="#9CE6FF" stroke="#2C97BB" stroke-width="2"/><text font-family="Arial" font-size="33" fill="#1a1a1a"><tspan x="1112" y="377.5">PostgreSQL</tspan></text><rect x="1600" y="288" width="448" height="160" rx="0" fill="#9CE6FF" stroke="#2C97BB" stroke-width="2"/><text font-family="Arial" font-size="33" fill="#1a1a1a"><tspan x="1624" y="354">Outbox relay</tspan><tspan x="1624" y="400.2">EventBridge</tspan></text><rect x="2112" y="288" width="448" height="160" rx="0" fill="#9CE6FF" stroke="#2C97BB" stroke-width="2"/><text font-family="Arial" font-size="33" fill="#1a1a1a"><tspan x="2136" y="377.5">Cache queue + worker</tspan></text><rect x="2624" y="288" width="448" height="160" rx="0" fill="#9CE6FF" stroke="#2C97BB" stroke-width="2"/><text font-family="Arial" font-size="33" fill="#1a1a1a"><tspan x="2648" y="377.5">Valkey / API</tspan></text><rect x="576" y="680" width="448" height="160" rx="0" fill="#FFE86D" stroke="#A28E26" stroke-width="2"/><text font-family="Arial" font-size="33" fill="#1a1a1a"><tspan x="600" y="746">2. Deduplicate,</tspan><tspan x="600" y="792.2">validate, stage</tspan></text><rect x="2624" y="2600" width="448" height="160" rx="0" fill="#FFE86D" stroke="#A28E26" stroke-width="2"/><text font-family="Arial" font-size="33" fill="#1a1a1a"><tspan x="2648" y="2666">12. Read cache;</tspan><tspan x="2648" y="2712.2">bounded DB fallback</tspan></text><text font-family="Arial" font-size="33" fill="#1a1a1a"><tspan x="308" y="521">1. Submit source version +</tspan><tspan x="308" y="567.2">job ID</tspan></text><text font-family="Arial" font-size="33" fill="#1a1a1a"><tspan x="820" y="905">3. Activate release +</tspan><tspan x="820" y="951.2">outbox in one transaction</tspan></text><text font-family="Arial" font-size="33" fill="#1a1a1a"><tspan x="820" y="1097">4. Committed version;</tspan><tspan x="820" y="1143.2">cache pending</tspan></text><text font-family="Arial" font-size="33" fill="#1a1a1a"><tspan x="1332" y="1289">5. Claim committed outbox</tspan><tspan x="1332" y="1335.2">entries</tspan></text><text font-family="Arial" font-size="33" fill="#1a1a1a"><tspan x="1332" y="1481">6.</tspan><tspan x="1332" y="1527.2">CatalogPublished(version)</tspan></text><text font-family="Arial" font-size="33" fill="#1a1a1a"><tspan x="1844" y="1673">7. Publish; acknowledge</tspan><tspan x="1844" y="1719.2">only successful entries</tspan></text><text font-family="Arial" font-size="33" fill="#1a1a1a"><tspan x="1332" y="1865">8. Load authoritative release</tspan></text><text font-family="Arial" font-size="33" fill="#1a1a1a"><tspan x="1332" y="2057">9. Products, prices and visibility</tspan></text><text font-family="Arial" font-size="33" fill="#1a1a1a"><tspan x="2356" y="2249">10. Build immutable views;</tspan><tspan x="2356" y="2295.2">CAS newer pointer</tspan></text><text font-family="Arial" font-size="33" fill="#1a1a1a"><tspan x="1332" y="2441">11. Record cache publication status</tspan></text><text font-family="Arial" font-size="33" fill="#1a1a1a"><tspan x="64" y="3553">Duplicates and older events are harmless. Failed jobs retry, then DLQ. Reconcile DB/cache versions. Checkout always revalidates live prices and stock; price changes</tspan><tspan x="64" y="3599.2">require customer acceptance.</tspan></text></svg>