<svg xmlns="http://www.w3.org/2000/svg" width="3200" height="3840" viewBox="0 0 3200 3840"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10" fill="#313131"/></marker></defs><rect width="100%" height="100%" fill="white"/><text font-family="Arial" font-size="67" fill="#1a1a1a" font-weight="bold"><tspan x="64" y="131">04. Checkout, Payment and Fulfillment</tspan></text><text font-family="Arial" font-size="33" fill="#1a1a1a"><tspan x="64" y="217">Customers pay on Wellisha  /  Captured payment evidence drives order confirmation  /  External outcomes may be pending</tspan></text><line x1="288" y1="448" x2="288" y2="3456" stroke="#b0b0b0" stroke-dasharray="5 5"/><line x1="800" y1="448" x2="800" y2="3456" stroke="#b0b0b0" stroke-dasharray="5 5"/><line x1="1312" y1="448" x2="1312" y2="3456" stroke="#b0b0b0" stroke-dasharray="5 5"/><line x1="1824" y1="448" x2="1824" y2="3456" stroke="#b0b0b0" stroke-dasharray="5 5"/><line x1="2336" y1="448" x2="2336" y2="3456" stroke="#b0b0b0" stroke-dasharray="5 5"/><line x1="2848" y1="448" x2="2848" y2="3456" stroke="#b0b0b0" stroke-dasharray="5 5"/><polyline points="292,640 796,640" fill="none" stroke="#313131" stroke-width="2" marker-end="url(#arrow)"/><polyline points="804,832 1308,832" fill="none" stroke="#313131" stroke-width="2" marker-end="url(#arrow)"/><polyline points="804,1024 1820,1024" fill="none" stroke="#313131" stroke-width="2" marker-end="url(#arrow)"/><polyline points="1820,1216 804,1216" fill="none" stroke="#313131" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="5 5"/><polyline points="804,1408 1308,1408" fill="none" stroke="#313131" stroke-width="2" marker-end="url(#arrow)"/><polyline points="796,1600 292,1600" fill="none" stroke="#313131" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="5 5"/><polyline points="292,1792 1820,1792" fill="none" stroke="#313131" stroke-width="2" marker-end="url(#arrow)"/><polyline points="1820,1984 804,1984" fill="none" stroke="#313131" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="5 5"/><polyline points="804,2176 1308,2176" fill="none" stroke="#313131" stroke-width="2" marker-end="url(#arrow)"/><polyline points="804,2368 1820,2368" fill="none" stroke="#313131" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="5 5"/><polyline points="2332,2560 1316,2560" fill="none" stroke="#313131" stroke-width="2" marker-end="url(#arrow)"/><polyline points="2340,2752 2844,2752" fill="none" stroke="#313131" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="5 5"/><polyline points="2844,2944 2340,2944" fill="none" stroke="#313131" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="5 5"/><polyline points="2332,3136 1316,3136" fill="none" stroke="#313131" stroke-width="2" marker-end="url(#arrow)"/><polyline points="292,3328 796,3328" fill="none" stroke="#313131" stroke-width="2" marker-end="url(#arrow)"/><rect x="64" y="288" width="448" height="160" rx="0" fill="#9CE6FF" stroke="#2C97BB" stroke-width="2"/><text font-family="Arial" font-size="33" fill="#1a1a1a"><tspan x="88" y="377.5">Web / Android / iOS</tspan></text><rect x="576" y="288" width="448" height="160" rx="0" fill="#9CE6FF" stroke="#2C97BB" stroke-width="2"/><text font-family="Arial" font-size="33" fill="#1a1a1a"><tspan x="600" y="377.5">Commerce API</tspan></text><rect x="1088" y="288" width="448" height="160" rx="0" fill="#9CE6FF" stroke="#2C97BB" stroke-width="2"/><text font-family="Arial" font-size="33" fill="#1a1a1a"><tspan x="1112" y="377.5">PostgreSQL</tspan></text><rect x="1600" y="288" width="448" height="160" rx="0" fill="#9CE6FF" stroke="#2C97BB" stroke-width="2"/><text font-family="Arial" font-size="33" fill="#1a1a1a"><tspan x="1624" y="377.5">Razorpay</tspan></text><rect x="2112" y="288" width="448" height="160" rx="0" fill="#9CE6FF" stroke="#2C97BB" stroke-width="2"/><text font-family="Arial" font-size="33" fill="#1a1a1a"><tspan x="2136" y="354">Inbox / outbox +</tspan><tspan x="2136" y="400.2">workers</tspan></text><rect x="2624" y="288" width="448" height="160" rx="0" fill="#9CE6FF" stroke="#2C97BB" stroke-width="2"/><text font-family="Arial" font-size="33" fill="#1a1a1a"><tspan x="2648" y="377.5">Fulfillment provider</tspan></text><text font-family="Arial" font-size="33" fill="#1a1a1a"><tspan x="308" y="521">1. Create order: quote +</tspan><tspan x="308" y="567.2">idempotency key</tspan></text><text font-family="Arial" font-size="33" fill="#1a1a1a"><tspan x="820" y="713">2. Reprice; reserve stock;</tspan><tspan x="820" y="759.2">persist pending order</tspan></text><text font-family="Arial" font-size="33" fill="#1a1a1a"><tspan x="820" y="905">3. Create payment order outside DB transaction</tspan></text><text font-family="Arial" font-size="33" fill="#1a1a1a"><tspan x="820" y="1097">4. Provider order ID or unknown outcome</tspan></text><text font-family="Arial" font-size="33" fill="#1a1a1a"><tspan x="820" y="1289">5. Persist payment</tspan><tspan x="820" y="1335.2">mapping; unknown -&gt;</tspan><tspan x="820" y="1381.4">reconcile</tspan></text><text font-family="Arial" font-size="33" fill="#1a1a1a"><tspan x="308" y="1481">6. Checkout details or 202</tspan><tspan x="308" y="1527.2">pending</tspan></text><text font-family="Arial" font-size="33" fill="#1a1a1a"><tspan x="308" y="1673">7. Customer completes payment</tspan></text><text font-family="Arial" font-size="33" fill="#1a1a1a"><tspan x="820" y="1865">8. Signed captured-payment webhook</tspan></text><text font-family="Arial" font-size="33" fill="#1a1a1a"><tspan x="820" y="2057">9. Verify signature;</tspan><tspan x="820" y="2103.2">persist unique inbox</tspan></text><text font-family="Arial" font-size="33" fill="#1a1a1a"><tspan x="820" y="2249">10. Acknowledge durable receipt</tspan></text><text font-family="Arial" font-size="33" fill="#1a1a1a"><tspan x="1332" y="2441">11. Validate payment binding; paid + outbox</tspan><tspan x="1332" y="2487.2">transaction</tspan></text><text font-family="Arial" font-size="33" fill="#1a1a1a"><tspan x="2356" y="2633">12. Create fulfillment</tspan><tspan x="2356" y="2679.2">using stable merchant ID</tspan></text><text font-family="Arial" font-size="33" fill="#1a1a1a"><tspan x="2356" y="2825">13. Accepted / status /</tspan><tspan x="2356" y="2871.2">ambiguous result</tspan></text><text font-family="Arial" font-size="33" fill="#1a1a1a"><tspan x="1332" y="3017">14. Persist tracking; reconcile; notification outbox</tspan></text><text font-family="Arial" font-size="33" fill="#1a1a1a"><tspan x="308" y="3209">15. Read order, payment</tspan><tspan x="308" y="3255.2">and shipment status</tspan></text><text font-family="Arial" font-size="33" fill="#1a1a1a"><tspan x="64" y="3553">Do not dispatch on browser success alone. Duplicate/out-of-order events cannot repeat effects. Late payment after stock expiry: recheck stock or compensate. Provider</tspan><tspan x="64" y="3599.2">timeout: reconcile before retry.</tspan></text></svg>