<svg xmlns="http://www.w3.org/2000/svg" width="3200" height="3840" viewBox="0 0 3200 3840"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10" fill="#313131"/></marker></defs><rect width="100%" height="100%" fill="white"/><text font-family="Arial" font-size="67" fill="#1a1a1a" font-weight="bold"><tspan x="64" y="131">05. Agent Cancellation and Refund</tspan></text><text font-family="Arial" font-size="33" fill="#1a1a1a"><tspan x="64" y="217">Customers contact support; only authorized agents can cancel  /  Backend RBAC enforces the restriction</tspan></text><line x1="288" y1="448" x2="288" y2="3456" stroke="#b0b0b0" stroke-dasharray="5 5"/><line x1="800" y1="448" x2="800" y2="3456" stroke="#b0b0b0" stroke-dasharray="5 5"/><line x1="1312" y1="448" x2="1312" y2="3456" stroke="#b0b0b0" stroke-dasharray="5 5"/><line x1="1824" y1="448" x2="1824" y2="3456" stroke="#b0b0b0" stroke-dasharray="5 5"/><line x1="2336" y1="448" x2="2336" y2="3456" stroke="#b0b0b0" stroke-dasharray="5 5"/><line x1="2848" y1="448" x2="2848" y2="3456" stroke="#b0b0b0" stroke-dasharray="5 5"/><polyline points="292,640 1308,640" fill="none" stroke="#313131" stroke-width="2" marker-end="url(#arrow)"/><polyline points="804,832 1308,832" fill="none" stroke="#313131" stroke-width="2" marker-end="url(#arrow)"/><polyline points="804,1024 1308,1024" fill="none" stroke="#313131" stroke-width="2" marker-end="url(#arrow)"/><polyline points="1316,1216 1820,1216" fill="none" stroke="#313131" stroke-width="2" marker-end="url(#arrow)"/><polyline points="1308,1408 804,1408" fill="none" stroke="#313131" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="5 5"/><polyline points="1828,1600 2332,1600" fill="none" stroke="#313131" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="5 5"/><polyline points="2332,1792 1828,1792" fill="none" stroke="#313131" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="5 5"/><polyline points="1828,2176 2844,2176" fill="none" stroke="#313131" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="5 5"/><polyline points="2844,2368 1316,2368" fill="none" stroke="#313131" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="5 5"/><polyline points="1316,2560 1820,2560" fill="none" stroke="#313131" stroke-width="2" marker-end="url(#arrow)"/><polyline points="292,2752 1308,2752" fill="none" stroke="#313131" stroke-width="2" marker-end="url(#arrow)"/><rect x="64" y="288" width="448" height="160" rx="0" fill="#9CE6FF" stroke="#2C97BB" stroke-width="2"/><text font-family="Arial" font-size="33" fill="#1a1a1a"><tspan x="88" y="377.5">Customer app</tspan></text><rect x="576" y="288" width="448" height="160" rx="0" fill="#9CE6FF" stroke="#2C97BB" stroke-width="2"/><text font-family="Arial" font-size="33" fill="#1a1a1a"><tspan x="600" y="354">Support agent Staff</tspan><tspan x="600" y="400.2">console</tspan></text><rect x="1088" y="288" width="448" height="160" rx="0" fill="#9CE6FF" stroke="#2C97BB" stroke-width="2"/><text font-family="Arial" font-size="33" fill="#1a1a1a"><tspan x="1112" y="377.5">Commerce API</tspan></text><rect x="1600" y="288" width="448" height="160" rx="0" fill="#9CE6FF" stroke="#2C97BB" stroke-width="2"/><text font-family="Arial" font-size="33" fill="#1a1a1a"><tspan x="1624" y="354">DB inbox/outbox +</tspan><tspan x="1624" y="400.2">queue workers</tspan></text><rect x="2112" y="288" width="448" height="160" rx="0" fill="#9CE6FF" stroke="#2C97BB" stroke-width="2"/><text font-family="Arial" font-size="33" fill="#1a1a1a"><tspan x="2136" y="377.5">Fulfillment provider</tspan></text><rect x="2624" y="288" width="448" height="160" rx="0" fill="#9CE6FF" stroke="#2C97BB" stroke-width="2"/><text font-family="Arial" font-size="33" fill="#1a1a1a"><tspan x="2648" y="377.5">Razorpay</tspan></text><rect x="1600" y="1832" width="448" height="160" rx="0" fill="#FFE86D" stroke="#A28E26" stroke-width="2"/><text font-family="Arial" font-size="33" fill="#1a1a1a"><tspan x="1624" y="1898">8. Confirmed cancel -&gt;</tspan><tspan x="1624" y="1944.2">refund intent</tspan></text><text font-family="Arial" font-size="33" fill="#1a1a1a"><tspan x="308" y="521">1. Create support case; no order mutation</tspan></text><text font-family="Arial" font-size="33" fill="#1a1a1a"><tspan x="820" y="713">2. Read assigned case;</tspan><tspan x="820" y="759.2">verify customer/order</tspan></text><text font-family="Arial" font-size="33" fill="#1a1a1a"><tspan x="820" y="905">3. Agent cancellation:</tspan><tspan x="820" y="951.2">case + reason + key</tspan></text><text font-family="Arial" font-size="33" fill="#1a1a1a"><tspan x="1332" y="1097">4. Check agent permission;</tspan><tspan x="1332" y="1143.2">lock; record intent</tspan></text><text font-family="Arial" font-size="33" fill="#1a1a1a"><tspan x="820" y="1289">5. 202 pending</tspan><tspan x="820" y="1335.2">cancellation</tspan></text><text font-family="Arial" font-size="33" fill="#1a1a1a"><tspan x="1844" y="1481">6. Cancel / reconcile</tspan><tspan x="1844" y="1527.2">in-flight submission</tspan></text><text font-family="Arial" font-size="33" fill="#1a1a1a"><tspan x="1844" y="1673">7. Accepted, rejected or</tspan><tspan x="1844" y="1719.2">pending</tspan></text><text font-family="Arial" font-size="33" fill="#1a1a1a"><tspan x="1844" y="2057">9. Submit deduplicated refund</tspan></text><text font-family="Arial" font-size="33" fill="#1a1a1a"><tspan x="1332" y="2249">10. Signed refund outcome callback</tspan></text><text font-family="Arial" font-size="33" fill="#1a1a1a"><tspan x="1332" y="2441">11. Durable inbox;</tspan><tspan x="1332" y="2487.2">validate; notify customer</tspan></text><text font-family="Arial" font-size="33" fill="#1a1a1a"><tspan x="308" y="2633">12. Read tracking and agent-action status</tspan></text><text font-family="Arial" font-size="33" fill="#1a1a1a"><tspan x="64" y="3553">Customer call to cancellation API -&gt; 403. A support case never automatically cancels an order. Manual provider-portal actions require an agent audit record and verified</tspan><tspan x="64" y="3599.2">reconciliation before completion.</tspan></text></svg>