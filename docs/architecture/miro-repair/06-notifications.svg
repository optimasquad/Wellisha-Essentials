<svg xmlns="http://www.w3.org/2000/svg" width="3200" height="3840" viewBox="0 0 3200 3840"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10" fill="#313131"/></marker></defs><rect width="100%" height="100%" fill="white"/><text font-family="Arial" font-size="67" fill="#1a1a1a" font-weight="bold"><tspan x="64" y="131">06. Asynchronous Email and SMS</tspan></text><text font-family="Arial" font-size="33" fill="#1a1a1a"><tspan x="64" y="217">Notifications never block checkout or fulfillment  /  Separate channel queues and delivery tracking</tspan></text><line x1="288" y1="448" x2="288" y2="3456" stroke="#b0b0b0" stroke-dasharray="5 5"/><line x1="800" y1="448" x2="800" y2="3456" stroke="#b0b0b0" stroke-dasharray="5 5"/><line x1="1312" y1="448" x2="1312" y2="3456" stroke="#b0b0b0" stroke-dasharray="5 5"/><line x1="1824" y1="448" x2="1824" y2="3456" stroke="#b0b0b0" stroke-dasharray="5 5"/><line x1="2336" y1="448" x2="2336" y2="3456" stroke="#b0b0b0" stroke-dasharray="5 5"/><line x1="2848" y1="448" x2="2848" y2="3456" stroke="#b0b0b0" stroke-dasharray="5 5"/><polyline points="292,640 796,640" fill="none" stroke="#313131" stroke-width="2" marker-end="url(#arrow)"/><polyline points="1308,832 804,832" fill="none" stroke="#313131" stroke-width="2" marker-end="url(#arrow)"/><polyline points="804,1024 1308,1024" fill="none" stroke="#313131" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="5 5"/><polyline points="1316,1216 1820,1216" fill="none" stroke="#313131" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="5 5"/><polyline points="1828,1408 2332,1408" fill="none" stroke="#313131" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="5 5"/><polyline points="2332,1600 804,1600" fill="none" stroke="#313131" stroke-width="2" marker-end="url(#arrow)"/><polyline points="2340,1792 2844,1792" fill="none" stroke="#313131" stroke-width="2" marker-end="url(#arrow)"/><polyline points="2844,1984 2340,1984" fill="none" stroke="#313131" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="5 5"/><polyline points="2332,2176 804,2176" fill="none" stroke="#313131" stroke-width="2" marker-end="url(#arrow)"/><polyline points="2844,2368 1828,2368" fill="none" stroke="#313131" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="5 5"/><polyline points="1828,2560 2332,2560" fill="none" stroke="#313131" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="5 5"/><polyline points="2332,2752 804,2752" fill="none" stroke="#313131" stroke-width="2" marker-end="url(#arrow)"/><rect x="64" y="288" width="448" height="160" rx="0" fill="#9CE6FF" stroke="#2C97BB" stroke-width="2"/><text font-family="Arial" font-size="33" fill="#1a1a1a"><tspan x="88" y="377.5">Commerce transaction</tspan></text><rect x="576" y="288" width="448" height="160" rx="0" fill="#9CE6FF" stroke="#2C97BB" stroke-width="2"/><text font-family="Arial" font-size="33" fill="#1a1a1a"><tspan x="600" y="377.5">DB outbox</tspan></text><rect x="1088" y="288" width="448" height="160" rx="0" fill="#9CE6FF" stroke="#2C97BB" stroke-width="2"/><text font-family="Arial" font-size="33" fill="#1a1a1a"><tspan x="1112" y="377.5">Relay + EventBridge</tspan></text><rect x="1600" y="288" width="448" height="160" rx="0" fill="#9CE6FF" stroke="#2C97BB" stroke-width="2"/><text font-family="Arial" font-size="33" fill="#1a1a1a"><tspan x="1624" y="354">Email / SMS queues +</tspan><tspan x="1624" y="400.2">DLQs</tspan></text><rect x="2112" y="288" width="448" height="160" rx="0" fill="#9CE6FF" stroke="#2C97BB" stroke-width="2"/><text font-family="Arial" font-size="33" fill="#1a1a1a"><tspan x="2136" y="377.5">Channel workers</tspan></text><rect x="2624" y="288" width="448" height="160" rx="0" fill="#9CE6FF" stroke="#2C97BB" stroke-width="2"/><text font-family="Arial" font-size="33" fill="#1a1a1a"><tspan x="2648" y="377.5">SES / AWS SMS</tspan></text><text font-family="Arial" font-size="33" fill="#1a1a1a"><tspan x="308" y="521">1. Commit business state +</tspan><tspan x="308" y="567.2">notification event</tspan></text><text font-family="Arial" font-size="33" fill="#1a1a1a"><tspan x="820" y="713">2. Claim committed event</tspan></text><text font-family="Arial" font-size="33" fill="#1a1a1a"><tspan x="820" y="905">3. Order / shipment /</tspan><tspan x="820" y="951.2">refund event</tspan></text><text font-family="Arial" font-size="33" fill="#1a1a1a"><tspan x="1332" y="1097">4. Fan out to independent</tspan><tspan x="1332" y="1143.2">channels</tspan></text><text font-family="Arial" font-size="33" fill="#1a1a1a"><tspan x="1844" y="1289">5. Deliver at least once</tspan></text><text font-family="Arial" font-size="33" fill="#1a1a1a"><tspan x="820" y="1481">6. Resolve consent/template; record unique send intent</tspan></text><text font-family="Arial" font-size="33" fill="#1a1a1a"><tspan x="2356" y="1673">7. Send email or</tspan><tspan x="2356" y="1719.2">registered SMS</tspan></text><text font-family="Arial" font-size="33" fill="#1a1a1a"><tspan x="2356" y="1865">8. Provider acceptance /</tspan><tspan x="2356" y="1911.2">message ID</tspan></text><text font-family="Arial" font-size="33" fill="#1a1a1a"><tspan x="820" y="2057">9. Store sent / unknown / failed attempt</tspan></text><text font-family="Arial" font-size="33" fill="#1a1a1a"><tspan x="1844" y="2249">10. Delivery feedback through event adapter</tspan></text><text font-family="Arial" font-size="33" fill="#1a1a1a"><tspan x="1844" y="2441">11. Process receipt /</tspan><tspan x="1844" y="2487.2">retry / DLQ</tspan></text><text font-family="Arial" font-size="33" fill="#1a1a1a"><tspan x="820" y="2633">12. Update delivery outcome; suppress invalid recipients</tspan></text><text font-family="Arial" font-size="33" fill="#1a1a1a"><tspan x="64" y="3553">Send acceptance is not delivery. Persistent dedupe limits repeats; ambiguous sends need a defined retry policy. SES production access; India SMS entity/template</tspan><tspan x="64" y="3599.2">registration; marketing consent is separate.</tspan></text></svg>