<svg xmlns="http://www.w3.org/2000/svg" width="3200" height="3840" viewBox="0 0 3200 3840"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10" fill="#313131"/></marker></defs><rect width="100%" height="100%" fill="white"/><text font-family="Arial" font-size="67" fill="#1a1a1a" font-weight="bold"><tspan x="64" y="131">07. Customer Delivery Tracking</tspan></text><text font-family="Arial" font-size="33" fill="#1a1a1a"><tspan x="64" y="217">One tracking experience across web, Android and iOS  /  Shipment-level timeline, ETA and last update</tspan></text><line x1="288" y1="448" x2="288" y2="3456" stroke="#b0b0b0" stroke-dasharray="5 5"/><line x1="800" y1="448" x2="800" y2="3456" stroke="#b0b0b0" stroke-dasharray="5 5"/><line x1="1312" y1="448" x2="1312" y2="3456" stroke="#b0b0b0" stroke-dasharray="5 5"/><line x1="1824" y1="448" x2="1824" y2="3456" stroke="#b0b0b0" stroke-dasharray="5 5"/><line x1="2336" y1="448" x2="2336" y2="3456" stroke="#b0b0b0" stroke-dasharray="5 5"/><line x1="2848" y1="448" x2="2848" y2="3456" stroke="#b0b0b0" stroke-dasharray="5 5"/><polyline points="292,640 796,640" fill="none" stroke="#313131" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="5 5"/><polyline points="804,832 1820,832" fill="none" stroke="#313131" stroke-width="2" marker-end="url(#arrow)"/><polyline points="796,1024 292,1024" fill="none" stroke="#313131" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="5 5"/><polyline points="1316,1216 1820,1216" fill="none" stroke="#313131" stroke-width="2" marker-end="url(#arrow)"/><polyline points="1316,1408 1820,1408" fill="none" stroke="#313131" stroke-width="2" marker-end="url(#arrow)"/><polyline points="1308,1600 292,1600" fill="none" stroke="#313131" stroke-width="2" marker-end="url(#arrow)"/><polyline points="292,1792 1308,1792" fill="none" stroke="#313131" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="5 5"/><polyline points="2844,1984 2340,1984" fill="none" stroke="#313131" stroke-width="2" marker-end="url(#arrow)"/><polyline points="2332,2176 1828,2176" fill="none" stroke="#313131" stroke-width="2" marker-end="url(#arrow)"/><polyline points="1828,2368 2332,2368" fill="none" stroke="#313131" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="5 5"/><polyline points="2340,2560 2844,2560" fill="none" stroke="#313131" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="5 5"/><polyline points="2844,2752 2340,2752" fill="none" stroke="#313131" stroke-width="2" marker-end="url(#arrow)"/><rect x="64" y="288" width="448" height="160" rx="0" fill="#9CE6FF" stroke="#2C97BB" stroke-width="2"/><text font-family="Arial" font-size="33" fill="#1a1a1a"><tspan x="88" y="377.5">Carrier / fulfillment</tspan></text><rect x="576" y="288" width="448" height="160" rx="0" fill="#9CE6FF" stroke="#2C97BB" stroke-width="2"/><text font-family="Arial" font-size="33" fill="#1a1a1a"><tspan x="600" y="354">Webhook API + durable</tspan><tspan x="600" y="400.2">inbox</tspan></text><rect x="1088" y="288" width="448" height="160" rx="0" fill="#9CE6FF" stroke="#2C97BB" stroke-width="2"/><text font-family="Arial" font-size="33" fill="#1a1a1a"><tspan x="1112" y="377.5">Tracking worker</tspan></text><rect x="1600" y="288" width="448" height="160" rx="0" fill="#9CE6FF" stroke="#2C97BB" stroke-width="2"/><text font-family="Arial" font-size="33" fill="#1a1a1a"><tspan x="1624" y="377.5">PostgreSQL</tspan></text><rect x="2112" y="288" width="448" height="160" rx="0" fill="#9CE6FF" stroke="#2C97BB" stroke-width="2"/><text font-family="Arial" font-size="33" fill="#1a1a1a"><tspan x="2136" y="377.5">Commerce API</tspan></text><rect x="2624" y="288" width="448" height="160" rx="0" fill="#9CE6FF" stroke="#2C97BB" stroke-width="2"/><text font-family="Arial" font-size="33" fill="#1a1a1a"><tspan x="2648" y="377.5">Customer app</tspan></text><text font-family="Arial" font-size="33" fill="#1a1a1a"><tspan x="308" y="521">1. Signed shipment event</tspan></text><text font-family="Arial" font-size="33" fill="#1a1a1a"><tspan x="820" y="713">2. Verify signature; store unique event</tspan></text><text font-family="Arial" font-size="33" fill="#1a1a1a"><tspan x="308" y="905">3. Acknowledge durable</tspan><tspan x="308" y="951.2">receipt</tspan></text><text font-family="Arial" font-size="33" fill="#1a1a1a"><tspan x="1332" y="1097">4. Claim inbox event;</tspan><tspan x="1332" y="1143.2">deduplicate</tspan></text><text font-family="Arial" font-size="33" fill="#1a1a1a"><tspan x="1332" y="1289">5. Normalize status;</tspan><tspan x="1332" y="1335.2">persist timeline + outbox</tspan></text><text font-family="Arial" font-size="33" fill="#1a1a1a"><tspan x="308" y="1481">6. Scheduled polling for missing/stale events</tspan></text><text font-family="Arial" font-size="33" fill="#1a1a1a"><tspan x="308" y="1673">7. Current provider shipment state</tspan></text><text font-family="Arial" font-size="33" fill="#1a1a1a"><tspan x="2356" y="1865">8. GET own order tracking;</tspan><tspan x="2356" y="1911.2">access token</tspan></text><text font-family="Arial" font-size="33" fill="#1a1a1a"><tspan x="1844" y="2057">9. Check ownership; read</tspan><tspan x="1844" y="2103.2">each shipment</tspan></text><text font-family="Arial" font-size="33" fill="#1a1a1a"><tspan x="1844" y="2249">10. Timeline, ETA, last</tspan><tspan x="1844" y="2295.2">update, exceptions</tspan></text><text font-family="Arial" font-size="33" fill="#1a1a1a"><tspan x="2356" y="2441">11. Tracking view;</tspan><tspan x="2356" y="2487.2">contact-support link</tspan></text><text font-family="Arial" font-size="33" fill="#1a1a1a"><tspan x="2356" y="2633">12. Refresh with ETag;</tspan><tspan x="2356" y="2679.2">back off offline</tspan></text><text font-family="Arial" font-size="33" fill="#1a1a1a"><tspan x="64" y="3553">No customer cancellation action. Split shipments remain separate; stale data is labeled. Do not regress shipment state for late events or expose another customer&apos;s order</tspan><tspan x="64" y="3599.2">by tracking ID.</tspan></text></svg>