<svg xmlns="http://www.w3.org/2000/svg" width="3200" height="3840" viewBox="0 0 3200 3840"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10" fill="#313131"/></marker></defs><rect width="100%" height="100%" fill="white"/><text font-family="Arial" font-size="67" fill="#1a1a1a" font-weight="bold"><tspan x="64" y="131">10. Product Media Publication</tspan></text><text font-family="Arial" font-size="33" fill="#1a1a1a"><tspan x="64" y="217">Approved product identity across web, Android and iOS  /  Originals preserved; delivery assets versioned</tspan></text><line x1="288" y1="448" x2="288" y2="3456" stroke="#b0b0b0" stroke-dasharray="5 5"/><line x1="800" y1="448" x2="800" y2="3456" stroke="#b0b0b0" stroke-dasharray="5 5"/><line x1="1312" y1="448" x2="1312" y2="3456" stroke="#b0b0b0" stroke-dasharray="5 5"/><line x1="1824" y1="448" x2="1824" y2="3456" stroke="#b0b0b0" stroke-dasharray="5 5"/><line x1="2336" y1="448" x2="2336" y2="3456" stroke="#b0b0b0" stroke-dasharray="5 5"/><line x1="2848" y1="448" x2="2848" y2="3456" stroke="#b0b0b0" stroke-dasharray="5 5"/><polyline points="292,640 796,640" fill="none" stroke="#313131" stroke-width="2" marker-end="url(#arrow)"/><polyline points="804,832 1308,832" fill="none" stroke="#313131" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="5 5"/><polyline points="1316,1216 1820,1216" fill="none" stroke="#313131" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="5 5"/><polyline points="1820,1408 804,1408" fill="none" stroke="#313131" stroke-width="2" marker-end="url(#arrow)"/><polyline points="1820,1600 1316,1600" fill="none" stroke="#313131" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="5 5"/><polyline points="1316,1792 2332,1792" fill="none" stroke="#313131" stroke-width="2" marker-end="url(#arrow)"/><polyline points="292,1984 2332,1984" fill="none" stroke="#313131" stroke-width="2" marker-end="url(#arrow)"/><polyline points="2340,2176 2844,2176" fill="none" stroke="#313131" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="5 5"/><polyline points="2844,2368 804,2368" fill="none" stroke="#313131" stroke-width="2" marker-end="url(#arrow)"/><rect x="64" y="288" width="448" height="160" rx="0" fill="#9CE6FF" stroke="#2C97BB" stroke-width="2"/><text font-family="Arial" font-size="33" fill="#1a1a1a"><tspan x="88" y="377.5">Merchandising</tspan></text><rect x="576" y="288" width="448" height="160" rx="0" fill="#9CE6FF" stroke="#2C97BB" stroke-width="2"/><text font-family="Arial" font-size="33" fill="#1a1a1a"><tspan x="600" y="377.5">S3 master assets</tspan></text><rect x="1088" y="288" width="448" height="160" rx="0" fill="#9CE6FF" stroke="#2C97BB" stroke-width="2"/><text font-family="Arial" font-size="33" fill="#1a1a1a"><tspan x="1112" y="354">EventBridge / SQS</tspan><tspan x="1112" y="400.2">Media worker</tspan></text><rect x="1600" y="288" width="448" height="160" rx="0" fill="#9CE6FF" stroke="#2C97BB" stroke-width="2"/><text font-family="Arial" font-size="33" fill="#1a1a1a"><tspan x="1624" y="354">Image processing /</tspan><tspan x="1624" y="400.2">MediaConvert</tspan></text><rect x="2112" y="288" width="448" height="160" rx="0" fill="#9CE6FF" stroke="#2C97BB" stroke-width="2"/><text font-family="Arial" font-size="33" fill="#1a1a1a"><tspan x="2136" y="377.5">Catalog media records</tspan></text><rect x="2624" y="288" width="448" height="160" rx="0" fill="#9CE6FF" stroke="#2C97BB" stroke-width="2"/><text font-family="Arial" font-size="33" fill="#1a1a1a"><tspan x="2648" y="377.5">CloudFront / clients</tspan></text><rect x="1088" y="872" width="448" height="160" rx="0" fill="#FFE86D" stroke="#A28E26" stroke-width="2"/><text font-family="Arial" font-size="33" fill="#1a1a1a"><tspan x="1112" y="914.5">3. Validate type,</tspan><tspan x="1112" y="960.7">size, metadata;</tspan><tspan x="1112" y="1006.9">deduplicate</tspan></text><rect x="2624" y="2408" width="448" height="160" rx="0" fill="#FFE86D" stroke="#A28E26" stroke-width="2"/><text font-family="Arial" font-size="33" fill="#1a1a1a"><tspan x="2648" y="2450.5">11. Choose viewport</tspan><tspan x="2648" y="2496.7">size / supported video</tspan><tspan x="2648" y="2542.9">format</tspan></text><text font-family="Arial" font-size="33" fill="#1a1a1a"><tspan x="308" y="521">1. Upload original /</tspan><tspan x="308" y="567.2">generated review master</tspan></text><text font-family="Arial" font-size="33" fill="#1a1a1a"><tspan x="820" y="713">2. Object-created event +</tspan><tspan x="820" y="759.2">asset version</tspan></text><text font-family="Arial" font-size="33" fill="#1a1a1a"><tspan x="1332" y="1097">4. Create bounded</tspan><tspan x="1332" y="1143.2">image/video derivatives</tspan></text><text font-family="Arial" font-size="33" fill="#1a1a1a"><tspan x="820" y="1289">5. Write derivatives to separate output prefix</tspan></text><text font-family="Arial" font-size="33" fill="#1a1a1a"><tspan x="1332" y="1481">6. Completion / failure</tspan><tspan x="1332" y="1527.2">event</tspan></text><text font-family="Arial" font-size="33" fill="#1a1a1a"><tspan x="1332" y="1673">7. Record ready variants; still unpublished</tspan></text><text font-family="Arial" font-size="33" fill="#1a1a1a"><tspan x="308" y="1865">8. Review branding, labels, video; approve version</tspan></text><text font-family="Arial" font-size="33" fill="#1a1a1a"><tspan x="2356" y="2057">9. Publish immutable URLs</tspan><tspan x="2356" y="2103.2">+ dimensions + alt text</tspan></text><text font-family="Arial" font-size="33" fill="#1a1a1a"><tspan x="820" y="2249">10. Fetch approved derivative through origin access</tspan></text><text font-family="Arial" font-size="33" fill="#1a1a1a"><tspan x="64" y="3553">Generated packaging is a mockup until approved. No processing loop: source and derivative prefixes differ. Only public product media is CDN-readable; invoices, imports</tspan><tspan x="64" y="3599.2">and customer data remain private.</tspan></text></svg>