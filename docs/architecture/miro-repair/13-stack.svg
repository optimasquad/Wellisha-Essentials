<svg xmlns="http://www.w3.org/2000/svg" width="3200" height="2240" viewBox="0 0 3200 2240"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10" fill="#313131"/></marker></defs><rect width="100%" height="100%" fill="white"/><text font-family="Arial" font-size="67" fill="#1a1a1a" font-weight="bold"><tspan x="64" y="131">13. Kotlin Backend and PostgreSQL Flexibility</tspan></text><text font-family="Arial" font-size="33" fill="#1a1a1a"><tspan x="64" y="217">Confirmed: Kotlin + Spring Boot and PostgreSQL. Design decisions guide implementation; APIs are not implemented yet.</tspan></text><rect x="64" y="320" width="992" height="736" fill="#9CE6FF" stroke="#b0b0b0"/><text font-family="Arial" font-size="33" fill="#1a1a1a" font-weight="bold"><tspan x="96" y="385">Backend stack</tspan></text><rect x="1104" y="320" width="992" height="736" fill="#FFE86D" stroke="#b0b0b0"/><text font-family="Arial" font-size="33" fill="#1a1a1a" font-weight="bold"><tspan x="1136" y="385">Flexible PostgreSQL data</tspan></text><rect x="2144" y="320" width="992" height="736" fill="#B8ACFB" stroke="#b0b0b0"/><text font-family="Arial" font-size="33" fill="#1a1a1a" font-weight="bold"><tspan x="2176" y="385">Safe schema evolution</tspan></text><rect x="64" y="1136" width="992" height="736" fill="#FFE86D" stroke="#b0b0b0"/><text font-family="Arial" font-size="33" fill="#1a1a1a" font-weight="bold"><tspan x="96" y="1201">Flexible queries</tspan></text><rect x="1104" y="1136" width="992" height="736" fill="#B8ACFB" stroke="#b0b0b0"/><text font-family="Arial" font-size="33" fill="#1a1a1a" font-weight="bold"><tspan x="1136" y="1201">Module boundaries</tspan></text><rect x="2144" y="1136" width="992" height="736" fill="#9CE6FF" stroke="#b0b0b0"/><text font-family="Arial" font-size="33" fill="#1a1a1a" font-weight="bold"><tspan x="2176" y="1201">Security and integrity</tspan></text><text font-family="Arial" font-size="33" fill="#1a1a1a"><tspan x="96" y="497">Kotlin + Spring Boot APIs and workers. JVM 21 /</tspan><tspan x="96" y="543.2">Corretto proposed. Spring Security validates</tspan><tspan x="96" y="589.4">Cognito tokens; OpenAPI generates web/mobile</tspan><tspan x="96" y="635.6">clients.</tspan></text><text font-family="Arial" font-size="33" fill="#1a1a1a"><tspan x="1136" y="497">Typed tables for orders, money, stock and</tspan><tspan x="1136" y="543.2">ownership. Validated, versioned JSONB for optional</tspan><tspan x="1136" y="589.4">product attributes and partner metadata. Index</tspan><tspan x="1136" y="635.6">actual queries.</tspan></text><text font-family="Arial" font-size="33" fill="#1a1a1a"><tspan x="2176" y="497">Flyway versioned migrations in one deployment job.</tspan><tspan x="2176" y="543.2">Add fields first; backfill; switch readers/writers;</tspan><tspan x="2176" y="589.4">remove old fields later. Rehearse migrations and</tspan><tspan x="2176" y="635.6">restores.</tspan></text><text font-family="Arial" font-size="33" fill="#1a1a1a"><tspan x="96" y="1313">Repository boundaries and parameterized SQL.</tspan><tspan x="96" y="1359.2">Allowlisted filters/sorts, cursor pagination and</tspan><tspan x="96" y="1405.4">query-plan checks. Add targeted reporting queries</tspan><tspan x="96" y="1451.6">without exposing database models.</tspan></text><text font-family="Arial" font-size="33" fill="#1a1a1a"><tspan x="1136" y="1313">Catalog, commerce, payment and fulfillment own</tspan><tspan x="1136" y="1359.2">their tables and writes. One PostgreSQL database</tspan><tspan x="1136" y="1405.4">initially; explicit service operations keep future</tspan><tspan x="1136" y="1451.6">extraction possible.</tspan></text><text font-family="Arial" font-size="33" fill="#1a1a1a"><tspan x="2176" y="1313">Check customer ownership on every request. Staff</tspan><tspan x="2176" y="1359.2">MFA and restricted permissions. Least-privilege DB</tspan><tspan x="2176" y="1405.4">roles, audited refunds, exact money, unique keys</tspan><tspan x="2176" y="1451.6">and atomic stock/payment transitions.</tspan></text><text font-family="Arial" font-size="33" fill="#1a1a1a"><tspan x="64" y="2049">S3 stores media, PDFs and large payloads; PostgreSQL stores searchable metadata and object references. JSONB supplements typed tables.</tspan></text></svg>