<svg xmlns="http://www.w3.org/2000/svg" width="3200" height="2240" viewBox="0 0 3200 2240"><rect width="100%" height="100%" fill="#fff"/><rect x="64" y="416" width="1488" height="1408" fill="#fcfafd" stroke="#b8acc4" stroke-width="2"/><rect x="80" y="432" width="1456" height="96" fill="#f0e7f5" stroke="#b8acc4" stroke-width="2"/><text font-family="Arial" font-size="33" fill="#2f203a"><tspan x="104" y="489.9">WELLISHA | Shop About Help Search Account Cart</tspan></text><rect x="1648" y="416" width="1488" height="1408" fill="#fcfafd" stroke="#b8acc4" stroke-width="2"/><rect x="1664" y="432" width="1456" height="96" fill="#f0e7f5" stroke="#b8acc4" stroke-width="2"/><text font-family="Arial" font-size="33" fill="#2f203a"><tspan x="1688" y="489.9">WELLISHA | Shop About Help Search Account Cart</tspan></text><rect x="128" y="736" width="1360" height="224" fill="#ffffff" stroke="#b8acc4" stroke-width="2"/><text font-family="Arial" font-size="33" fill="#2f203a"><tspan x="152" y="834.8">[Product photo] XXL pads / 15-pad pack</tspan><tspan x="152" y="881">Qty - 1 + [Price] Remove</tspan></text><rect x="128" y="1008" width="1360" height="96" fill="#ffffff" stroke="#b8acc4" stroke-width="2"/><text font-family="Arial" font-size="28" fill="#2f203a"><tspan x="152" y="1064.4">Promo code [________] Apply</tspan></text><rect x="128" y="1176" width="1360" height="256" fill="#f0e7f5" stroke="#b8acc4" stroke-width="2"/><text font-family="Arial" font-size="33" fill="#2f203a"><tspan x="152" y="1267.7">Subtotal [amount]</tspan><tspan x="152" y="1313.9">Discount / delivery / tax [amount]</tspan><tspan x="152" y="1360.1000000000001">Total [server-calculated amount]</tspan></text><rect x="128" y="1504" width="1360" height="96" fill="#693e83" stroke="#b8acc4" stroke-width="2"/><text font-family="Arial" font-size="33" fill="#ffffff"><tspan x="152" y="1561.9">Continue to checkout</tspan></text><rect x="1712" y="736" width="1360" height="256" fill="#ffffff" stroke="#b8acc4" stroke-width="2"/><text font-family="Arial" font-size="33" fill="#2f203a"><tspan x="1736" y="827.7">Saved delivery address / add address</tspan><tspan x="1736" y="873.9000000000001">Name, phone, address, PIN code</tspan><tspan x="1736" y="920.1">[Delivery availability]</tspan></text><rect x="1712" y="1056" width="1360" height="160" fill="#f0e7f5" stroke="#b8acc4" stroke-width="2"/><text font-family="Arial" font-size="33" fill="#2f203a"><tspan x="1736" y="1122.8">Order summary and accepted quote</tspan><tspan x="1736" y="1169">[Items] [Final amount]</tspan></text><rect x="1712" y="1280" width="1360" height="128" fill="#eedff4" stroke="#b8acc4" stroke-width="2"/><text font-family="Arial" font-size="33" fill="#2f203a"><tspan x="1736" y="1353.9">Preparing payment... Your order is saved.</tspan></text><rect x="1712" y="1472" width="1360" height="96" fill="#693e83" stroke="#b8acc4" stroke-width="2"/><text font-family="Arial" font-size="33" fill="#ffffff"><tspan x="1736" y="1529.9">Pay securely - enabled when ready</tspan></text><text font-family="Arial" font-size="67" fill="#231266" font-weight="bold"><tspan x="64" y="131">15. UI Wireframes - Cart and Checkout</tspan></text><text font-family="Arial" font-size="33" fill="#231266"><tspan x="64" y="217">Desktop checkout flow. A saved order may remain pending while payment is prepared or verified; fulfillment is asynchronous.</tspan></text><text font-family="Arial" font-size="33" fill="#231266" font-weight="bold"><tspan x="64" y="321">Cart</tspan></text><text font-family="Arial" font-size="33" fill="#231266" font-weight="bold"><tspan x="1648" y="321">Address / checkout</tspan></text><text font-family="Arial" font-size="48" fill="#231266" font-weight="bold"><tspan x="128" y="656">Your cart</tspan></text><text font-family="Arial" font-size="28" fill="#231266"><tspan x="128" y="1676">Prices and stock are rechecked before payment.</tspan></text><text font-family="Arial" font-size="48" fill="#231266" font-weight="bold"><tspan x="1712" y="656">Checkout</tspan></text><text font-family="Arial" font-size="28" fill="#231266"><tspan x="1712" y="1660">After checkout: verifying payment... then order confirmed.</tspan></text><text font-family="Arial" font-size="33" fill="#231266"><tspan x="64" y="1985">Review states: address error, changed quote, stock unavailable, pending setup, failed payment and reload recovery. Never confirm payment from a browser return alone.</tspan></text></svg>
