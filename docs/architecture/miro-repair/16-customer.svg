<svg xmlns="http://www.w3.org/2000/svg" width="3200" height="2240" viewBox="0 0 3200 2240"><rect width="100%" height="100%" fill="#fff"/><rect x="64" y="416" width="2032" height="1408" fill="#fcfafd" stroke="#b8acc4" stroke-width="2"/><rect x="80" y="432" width="2000" height="96" fill="#f0e7f5" stroke="#b8acc4" stroke-width="2"/><text font-family="Arial" font-size="33" fill="#2f203a"><tspan x="104" y="489.9">WELLISHA | Shop About Help Search Account Cart</tspan></text><rect x="2304" y="416" width="832" height="1408" fill="#fcfafd" stroke="#b8acc4" stroke-width="2"/><rect x="2320" y="432" width="800" height="96" fill="#f0e7f5" stroke="#b8acc4" stroke-width="2"/><text font-family="Arial" font-size="28" fill="#2f203a"><tspan x="2344" y="488.4">WELLISHA | Menu Cart</tspan></text><rect x="128" y="720" width="1904" height="144" fill="#f0e7f5" stroke="#b8acc4" stroke-width="2"/><text font-family="Arial" font-size="33" fill="#2f203a"><tspan x="152" y="778.8">Payment: confirmed | Fulfillment: preparing</tspan><tspan x="152" y="825">Estimated delivery: [date / unavailable]</tspan></text><rect x="144" y="960" width="400" height="112" fill="#eedff4" stroke="#b8acc4" stroke-width="2"/><text font-family="Arial" font-size="33" fill="#2f203a"><tspan x="168" y="1025.9">Confirmed</tspan></text><rect x="608" y="960" width="400" height="112" fill="#ffffff" stroke="#b8acc4" stroke-width="2"/><text font-family="Arial" font-size="33" fill="#2f203a"><tspan x="632" y="1025.9">Packed</tspan></text><rect x="1072" y="960" width="400" height="112" fill="#ffffff" stroke="#b8acc4" stroke-width="2"/><text font-family="Arial" font-size="33" fill="#2f203a"><tspan x="1096" y="1025.9">Shipped</tspan></text><rect x="1536" y="960" width="400" height="112" fill="#ffffff" stroke="#b8acc4" stroke-width="2"/><text font-family="Arial" font-size="33" fill="#2f203a"><tspan x="1560" y="1025.9">Delivered</tspan></text><rect x="128" y="1168" width="1904" height="192" fill="#ffffff" stroke="#b8acc4" stroke-width="2"/><text font-family="Arial" font-size="33" fill="#2f203a"><tspan x="152" y="1227.7">Shipment 1 - [carrier / tracking number]</tspan><tspan x="152" y="1273.9">Latest event [status, location, timestamp]</tspan><tspan x="152" y="1320.1000000000001">Last updated [time] Refresh</tspan></text><rect x="128" y="1424" width="1904" height="192" fill="#ffffff" stroke="#b8acc4" stroke-width="2"/><text font-family="Arial" font-size="33" fill="#2f203a"><tspan x="152" y="1506.8">Items / delivery address summary</tspan><tspan x="152" y="1553">Cancellation / refund status, if applicable</tspan></text><rect x="128" y="1680" width="1904" height="96" fill="#693e83" stroke="#b8acc4" stroke-width="2"/><text font-family="Arial" font-size="33" fill="#ffffff"><tspan x="152" y="1737.9">Contact support</tspan></text><rect x="2344" y="736" width="736" height="96" fill="#f0e7f5" stroke="#b8acc4" stroke-width="2"/><text font-family="Arial" font-size="28" fill="#2f203a"><tspan x="2368" y="792.4">Order [number]</tspan></text><rect x="2344" y="880" width="736" height="96" fill="#ffffff" stroke="#b8acc4" stroke-width="2"/><text font-family="Arial" font-size="28" fill="#2f203a"><tspan x="2368" y="936.4">Topic [Delivery / order help]</tspan></text><rect x="2344" y="1032" width="736" height="304" fill="#ffffff" stroke="#b8acc4" stroke-width="2"/><text font-family="Arial" font-size="33" fill="#2f203a"><tspan x="2368" y="1170.8">Describe the issue [________]</tspan><tspan x="2368" y="1217">[Optional attachment]</tspan></text><rect x="2344" y="1400" width="736" height="96" fill="#693e83" stroke="#b8acc4" stroke-width="2"/><text font-family="Arial" font-size="33" fill="#ffffff"><tspan x="2368" y="1457.9">Send support request</tspan></text><text font-family="Arial" font-size="67" fill="#231266" font-weight="bold"><tspan x="64" y="131">16. UI Wireframes - Tracking and Support</tspan></text><text font-family="Arial" font-size="33" fill="#231266"><tspan x="64" y="217">Customer flow: track delivery, contact support, read cancellation/refund status. Execution of cancellation remains staff-only.</tspan></text><text font-family="Arial" font-size="33" fill="#231266" font-weight="bold"><tspan x="64" y="321">Desktop / order tracking</tspan></text><text font-family="Arial" font-size="33" fill="#231266" font-weight="bold"><tspan x="2304" y="321">Mobile / contact support</tspan></text><text font-family="Arial" font-size="48" fill="#231266" font-weight="bold"><tspan x="128" y="656">Order [number]</tspan></text><text font-family="Arial" font-size="44" fill="#231266" font-weight="bold"><tspan x="2344" y="636">How can we help?</tspan></text><text font-family="Arial" font-size="28" fill="#231266"><tspan x="2344" y="1588">Case [number] / status Our team will review</tspan><tspan x="2344" y="1627.2">your request.</tspan></text><text font-family="Arial" font-size="33" fill="#231266"><tspan x="64" y="1985">Review states: split shipments, stale tracking, provider delay, offline refresh and open case. Customer support requests do not automatically cancel or refund an order.</tspan></text></svg>
