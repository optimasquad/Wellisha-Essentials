<svg xmlns="http://www.w3.org/2000/svg" width="3200" height="2240" viewBox="0 0 3200 2240"><rect width="100%" height="100%" fill="#fff"/><rect x="64" y="416" width="1488" height="1408" fill="#fcfafd" stroke="#b8acc4" stroke-width="2"/><rect x="80" y="432" width="1456" height="96" fill="#f0e7f5" stroke="#b8acc4" stroke-width="2"/><text font-family="Arial" font-size="33" fill="#2f203a"><tspan x="104" y="489.9">WELLISHA | Shop About Help Search Account Cart</tspan></text><rect x="1648" y="416" width="1488" height="1408" fill="#fcfafd" stroke="#b8acc4" stroke-width="2"/><rect x="1664" y="432" width="1456" height="96" fill="#f0e7f5" stroke="#b8acc4" stroke-width="2"/><text font-family="Arial" font-size="33" fill="#2f203a"><tspan x="1688" y="489.9">WELLISHA | Shop About Help Search Account Cart</tspan></text><rect x="128" y="736" width="1360" height="192" fill="#f0e7f5" stroke="#b8acc4" stroke-width="2"/><text font-family="Arial" font-size="33" fill="#2f203a"><tspan x="152" y="795.7">Case [number] / customer request</tspan><tspan x="152" y="841.9000000000001">Order [number] / fulfillment state</tspan><tspan x="152" y="888.1">Provider outcome [accepted / unknown]</tspan></text><rect x="128" y="1000" width="1360" height="144" fill="#ffffff" stroke="#b8acc4" stroke-width="2"/><text font-family="Arial" font-size="33" fill="#2f203a"><tspan x="152" y="1058.8">Reason [approved reason]</tspan><tspan x="152" y="1105">Agent notes [________]</tspan></text><rect x="128" y="1216" width="1360" height="144" fill="#eedff4" stroke="#b8acc4" stroke-width="2"/><text font-family="Arial" font-size="33" fill="#2f203a"><tspan x="152" y="1274.8">Eligibility and dispatch status checked</tspan><tspan x="152" y="1321">Review before requesting cancellation</tspan></text><rect x="128" y="1456" width="1360" height="96" fill="#693e83" stroke="#b8acc4" stroke-width="2"/><text font-family="Arial" font-size="33" fill="#ffffff"><tspan x="152" y="1513.9">Request cancellation</tspan></text><rect x="1712" y="736" width="1360" height="256" fill="#f0e7f5" stroke="#b8acc4" stroke-width="2"/><text font-family="Arial" font-size="33" fill="#2f203a"><tspan x="1736" y="804.6">Captured amount [amount]</tspan><tspan x="1736" y="850.8000000000001">Already refunded / pending [amount]</tspan><tspan x="1736" y="897">Eligible refund [server-calculated limit]</tspan><tspan x="1736" y="943.2">Evidence [cancelled / verified return]</tspan></text><rect x="1712" y="1064" width="1360" height="144" fill="#ffffff" stroke="#b8acc4" stroke-width="2"/><text font-family="Arial" font-size="33" fill="#2f203a"><tspan x="1736" y="1122.8">Refund reason and case [________]</tspan><tspan x="1736" y="1169">Amount [bounded by eligibility]</tspan></text><rect x="1712" y="1280" width="1360" height="96" fill="#eedff4" stroke="#b8acc4" stroke-width="2"/><text font-family="Arial" font-size="28" fill="#2f203a"><tspan x="1736" y="1336.4">Confirm authorized action and audit details</tspan></text><rect x="1712" y="1456" width="1360" height="96" fill="#693e83" stroke="#b8acc4" stroke-width="2"/><text font-family="Arial" font-size="33" fill="#ffffff"><tspan x="1736" y="1513.9">Submit eligible refund</tspan></text><text font-family="Arial" font-size="67" fill="#231266" font-weight="bold"><tspan x="64" y="131">17. UI Wireframes - Staff Cancellation and Refund</tspan></text><text font-family="Arial" font-size="33" fill="#231266"><tspan x="64" y="217">Restricted staff workspace. Permissions and current eligibility are enforced by the backend; actions are audited.</tspan></text><text font-family="Arial" font-size="33" fill="#231266" font-weight="bold"><tspan x="64" y="321">Staff / cancellation review</tspan></text><text font-family="Arial" font-size="33" fill="#231266" font-weight="bold"><tspan x="1648" y="321">Staff / refund review</tspan></text><text font-family="Arial" font-size="44" fill="#231266" font-weight="bold"><tspan x="128" y="652">Order and case review</tspan></text><text font-family="Arial" font-size="28" fill="#231266"><tspan x="128" y="1644">Pending means provider confirmation is still required.</tspan></text><text font-family="Arial" font-size="44" fill="#231266" font-weight="bold"><tspan x="1712" y="652">Refund eligibility</tspan></text><text font-family="Arial" font-size="28" fill="#231266"><tspan x="1712" y="1644">Refund requested -&gt; processing -&gt; completed / review.</tspan></text><text font-family="Arial" font-size="33" fill="#231266"><tspan x="64" y="1985">Review states: permission denied, MFA required, dispatch race, rejected cancellation, unknown provider outcome and refund limit exceeded. No direct paid/refunded state</tspan><tspan x="64" y="2031.2">override.</tspan></text></svg>
