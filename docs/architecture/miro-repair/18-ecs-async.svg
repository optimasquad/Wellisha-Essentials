<svg xmlns="http://www.w3.org/2000/svg" width="3200" height="2240" viewBox="0 0 3200 2240"><rect width="100%" height="100%" fill="#fff"/><rect x="64" y="416" width="608" height="432" fill="#9ce6ff" stroke="#757575" stroke-width="2"/><text font-family="Arial" font-size="33" fill="#231266"><tspan x="88" y="572.6">Web ECS service</tspan><tspan x="88" y="618.8000000000001">Next.js UI / BFF</tspan><tspan x="88" y="665">Independent scaling</tspan><tspan x="88" y="711.2">No commerce DB access</tspan></text><rect x="832" y="416" width="608" height="432" fill="#9ce6ff" stroke="#757575" stroke-width="2"/><text font-family="Arial" font-size="33" fill="#231266"><tspan x="856" y="572.6">API ECS service</tspan><tspan x="856" y="618.8000000000001">Kotlin / Spring Boot</tspan><tspan x="856" y="665">Auth / quote / orders</tspan><tspan x="856" y="711.2">Returns owned status URL</tspan></text><rect x="1600" y="416" width="608" height="432" fill="#ffe86d" stroke="#757575" stroke-width="2"/><text font-family="Arial" font-size="33" fill="#231266"><tspan x="1624" y="572.6">RDS PostgreSQL</tspan><tspan x="1624" y="618.8000000000001">Short ACID commit</tspan><tspan x="1624" y="665">Order / stock / outbox</tspan><tspan x="1624" y="711.2">No provider call in locks</tspan></text><rect x="2368" y="416" width="608" height="432" fill="#b8acfb" stroke="#757575" stroke-width="2"/><text font-family="Arial" font-size="33" fill="#231266"><tspan x="2392" y="572.6">Worker ECS services</tspan><tspan x="2392" y="618.8000000000001">Payment / fulfillment</tspan><tspan x="2392" y="665">Refund / notification</tspan><tspan x="2392" y="711.2">Catalog-media / outbox</tspan></text><rect x="64" y="1136" width="992" height="672" fill="#ffe86d" stroke="#757575" stroke-width="2"/><rect x="1104" y="1136" width="992" height="672" fill="#b8acfb" stroke="#757575" stroke-width="2"/><rect x="2144" y="1136" width="992" height="672" fill="#9ce6ff" stroke="#757575" stroke-width="2"/><text font-family="Arial" font-size="67" fill="#231266" font-weight="bold"><tspan x="64" y="131">18. ECS Services, Cache and Async Responses</tspan></text><text font-family="Arial" font-size="33" fill="#231266"><tspan x="64" y="217">Independent UI, API and workers. Accepted means durably saved; payment and fulfillment completion have separate states.</tspan></text><text font-family="Arial" font-size="33" fill="#231266" font-weight="bold"><tspan x="64" y="961">Customer flow: saved order -&gt; preparing payment -&gt; checkout ready -&gt; verification pending -&gt; confirmed -&gt; delivery updates.</tspan></text><text font-family="Arial" font-size="33" fill="#231266" font-weight="bold"><tspan x="96" y="1217">Cache boundaries</tspan></text><text font-family="Arial" font-size="33" fill="#231266"><tspan x="96" y="1329">CloudFront: UI assets and public media. Valkey:</tspan><tspan x="96" y="1375.2">versioned public catalog. Private pages, carts,</tspan><tspan x="96" y="1421.4">quotes, ownership, payment/refund truth and stock</tspan><tspan x="96" y="1467.6">decisions bypass shared caches.</tspan></text><text font-family="Arial" font-size="33" fill="#231266" font-weight="bold"><tspan x="1136" y="1217">Prompt async response</tspan></text><text font-family="Arial" font-size="33" fill="#231266"><tspan x="1136" y="1329">Return 202 only after durable order / reservation /</tspan><tspan x="1136" y="1375.2">attempt / outbox commit. A worker prepares payment;</tspan><tspan x="1136" y="1421.4">UI polls owned status. Verified payment triggers</tspan><tspan x="1136" y="1467.6">fulfillment without waiting for delivery jobs.</tspan></text><text font-family="Arial" font-size="33" fill="#231266" font-weight="bold"><tspan x="2176" y="1217">Independent operations</tspan></text><text font-family="Arial" font-size="33" fill="#231266"><tspan x="2176" y="1329">Per-service roles, secrets, deployments and</tspan><tspan x="2176" y="1375.2">scaling. Bound total DB connections and provider</tspan><tspan x="2176" y="1421.4">concurrency. Isolate queue failures; reconcile</tspan><tspan x="2176" y="1467.6">unknown outcomes. Migration is a controlled one-off</tspan><tspan x="2176" y="1513.8">task.</tspan></text><text font-family="Arial" font-size="33" fill="#231266"><tspan x="64" y="1985">Security/test gates: prepared SQL, current ownership checks, Secrets Manager credentials, unit + PostgreSQL integration + WireMock + AWS staging tests.</tspan></text></svg>
