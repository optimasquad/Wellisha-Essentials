end="url(#arrow)"/><polyline points="1780,740 1780,1400" fill="none" stroke="#313131" stroke-width="2" marker-end="url(#arrow)"/><polyline points="1952,1536 2112,1536" fill="none" stroke="#313131" stroke-width="2" marker-end="url(#arrow)"/><polyline points="2284,1400 2284,1192" fill="none" stroke="#313131" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="5 5"/><polyline points="2456,1056 2616,1056" fill="none" stroke="#313131" stroke-width="2" marker-end="url(#arrow)"/><polyline points="2456,1056 2536,1056 2536,1536 2616,1536" fill="none" stroke="#313131" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="5 5"/><polyline points="1276,1192 1276,1400" fill="none" stroke="#313131" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="5 5"/><rect x="96" y="440" width="344" height="272" rx="0" fill="#9CE6FF" stroke="#2C97BB" stroke-width="2"/><text font-family="Arial" font-size="33" fill="#1a1a1a"><tspan x="120" y="538.5">Web storefront</tspan><tspan x="120" y="584.7">Android / iOS</tspan><tspan x="120" y="630.9">apps</tspan></text><rect x="96" y="920" width="344" height="272" rx="0" fill="#9CE6FF" stroke="#2C97BB" stroke-width="2"/><text font-family="Arial" font-size="33" fill="#1a1a1a"><tspan x="120" y="1018.5">Staff console</tspan><tspan x="120" y="1064.7">Catalog /</tspan><tspan x="120" y="1110.9">support</tspan></text><rect x="96" y="1400" width="344" height="272" rx="0" fill="#9CE6FF" stroke="#2C97BB" stroke-width="2"/><text font-family="Arial" font-size="33" fill="#1a1a1a"><tspan x="120" y="1522">Merchandising</tspan><tspan x="120" y="1568.2">Artwork / video</tspan></text><rect x="600" y="440" width="344" height="272" rx="0" fill="#9CE6FF" stroke="#2C97BB" stroke-width="2"/><text font-family="Arial" font-size="33" fill="#1a1a1a"><tspan x="624" y="538.5">Route 53 / ACM</tspan><tspan x="624" y="584.7">CloudFront / AWS</tspan><tspan x="624" y="630.9">WAF</tspan></text><rect x="600" y="920" width="344" height="272" rx="0" fill="#9CE6FF" stroke="#2C97BB" stroke-width="2"/><text font-family="Arial" font-size="33" fill="#1a1a1a"><tspan x="624" y="1018.5">Amazon Cognito</tspan><tspan x="624" y="1064.7">Federated</tspan><tspan x="624" y="1110.9">sign-in</tspan></text><rect x="600" y="1400" width="344" height="272" rx="0" fill="#9CE6FF" stroke="#2C97BB" stroke-width="2"/><text font-family="Arial" font-size="33" fill="#1a1a1a"><tspan x="624" y="1498.5">S3 / media</tspan><tspan x="624" y="1544.7">worker</tspan><tspan x="624" y="1590.9">MediaConvert</tspan></text><rect x="1104" y="440" width="344" height="272" rx="0" fill="#FFE86D" stroke="#A28E26" stroke-width="2"/><text font-family="Arial" font-size="33" fill="#1a1a1a"><tspan x="1128" y="538.5">Next.js on ECS</tspan><tspan x="1128" y="584.7">Session BFF</tspan><tspan x="1128" y="630.9">No DB access</tspan></text><rect x="1608" y="440" width="344" height="300" rx="0" fill="#FFE86D" stroke="#A28E26" stroke-width="2"/><text font-family="Arial" font-size="33" fill="#1a1a1a"><tspan x="1632" y="505.5">Kotlin API</tspan><tspan x="1632" y="551.7">Spring Boot</tspan><tspan x="1632" y="597.9">Catalog / orders</tspan><tspan x="1632" y="644.1">Pay / track /</tspan><tspan x="1632" y="690.3">support</tspan></text><rect x="1104" y="920" width="344" height="272" rx="0" fill="#FFE86D" stroke="#A28E26" stroke-width="2"/><text font-family="Arial" font-size="33" fill="#1a1a1a"><tspan x="1128" y="995">Kotlin workers</tspan><tspan x="1128" y="1041.2">Catalog imports</tspan><tspan x="1128" y="1087.4">Versioned</tspan><tspan x="1128" y="1133.6">releases</tspan></text><rect x="1104" y="1400" width="344" height="272" rx="24" fill="#FFE86D" stroke="#A28E26" stroke-width="2"/><text font-family="Arial" font-size="33" fill="#1a1a1a"><tspan x="1128" y="1522">Valkey cache</tspan><tspan x="1128" y="1568.2">Read models only</tspan></text><rect x="1608" y="1400" width="344" height="272" rx="24" fill="#FFE86D" stroke="#A28E26" stroke-width="2"/><text font-family="Arial" font-size="33" fill="#1a1a1a"><tspan x="1632" y="1475">PostgreSQL</tspan><tspan x="1632" y="1521.2">Multi-AZ RDS</tspan><tspan x="1632" y="1567.4">Typed + JSONB</tspan><tspan x="1632" y="1613.6">Stock / outbox</tspan></text><rect x="2112" y="1400" width="344" height="272" rx="0" fill="#B8ACFB" stroke="#8A7BE0" stroke-width="2"/><text font-family="Arial" font-size="33" fill="#1a1a1a"><tspan x="2136" y="1475">Outbox relay</tspan><tspan x="2136" y="1521.2">EventBridge /</tspan><tspan x="2136" y="1567.4">SQS</tspan><tspan x="2136" y="1613.6">Dedicated DLQs</tspan></text><rect x="2112" y="920" width="344" height="272" rx="0" fill="#B8ACFB" stroke="#8A7BE0" stroke-width="2"/><text font-family="Arial" font-size="33" fill="#1a1a1a"><tspan x="2136" y="971.5">Kotlin workers</tspan><tspan x="2136" y="1017.7">Spring Boot</tspan><tspan x="2136" y="1063.9">Fulfill / refund</tspan><tspan x="2136" y="1110.1">Reconcile /</tspan><tspan x="2136" y="1156.3">retry</tspan></text><rect x="2616" y="440" width="344" height="272" rx="0" fill="#B8ACFB" stroke="#8A7BE0" stroke-width="2"/><text font-family="Arial" font-size="33" fill="#1a1a1a"><tspan x="2640" y="562">Razorpay</tspan><tspan x="2640" y="608.2">Payment / refund</tspan></text><rect x="2616" y="920" width="344" height="272" rx="0" fill="#B8ACFB" stroke="#8A7BE0" stroke-width="2"/><text font-family="Arial" font-size="33" fill="#1a1a1a"><tspan x="2640" y="1018.5">Amazon MCF / 3PL</tspan><tspan x="2640" y="1064.7">Contracted</tspan><tspan x="2640" y="1110.9">provider</tspan></text><rect x="2616" y="1400" width="344" height="272" rx="0" fill="#B8ACFB" stroke="#8A7BE0" stroke-width="2"/><text font-family="Arial" font-size="33" fill="#1a1a1a"><tspan x="2640" y="1498.5">SES / AWS SMS</tspan><tspan x="2640" y="1544.7">Independent</tspan><tspan x="2640" y="1590.9">workers</tspan></text><text font-family="Arial" font-size="33" fill="#1a1a1a"><tspan x="600" y="1825">Identity: clients obtain Cognito tokens; the API enforces roles and resource ownership.</tspan></text><text font-family="Arial" font-size="33" fill="#1a1a1a"><tspan x="600" y="1921">Provider callbacks: verified at the API and durably stored before acknowledgement. Scheduler handles expiry and reconciliation.</tspan></text><text font-family="Arial" font-size="33" fill="#1a1a1a"><tspan x="64" y="2049">AWS foundation: private subnets / two AZs / scoped IAM / KMS / Secrets Manager / CloudWatch and tracing / tested restores.</tspan></text><text font-family="Arial" font-size="33" fill="#1a1a1a"><tspan x="64" y="2145">Delivery: GitHub Actions OIDC → ECR → CDK. Flipkart / Meesho remain optional sales channels, subject to partner access.</tspan></text><text font-family="Arial" font-size="28" fill="#1a1a1a"><tspan x="444" y="532">HTTPS</tspan></text><text font-family="Arial" font-size="28" fill="#1a1a1a"><tspan x="948" y="532">ALB</tspan></text><text font-family="Arial" font-size="28" fill="#1a1a1a"><tspan x="1452" y="532">API</tspan></text><text font-family="Arial" font-size="28" fill="#1a1a1a"><tspan x="2208" y="546">Payment</tspan><tspan x="2208" y="585.2">API</tspan></text><text font-family="Arial" font-size="28" fill="#1a1a1a"><tspan x="1804" y="1074">Transaction</tspan></text><text font-family="Arial" font-size="28" fill="#1a1a1a"><tspan x="1956" y="1492">Outbox</tspan></text><text font-family="Arial" font-size="28" fill="#1a1a1a"><tspan x="2308" y="1300">Jobs</tspan></text><text font-family="Arial" font-size="28" fill="#1a1a1a"><tspan x="2460" y="1012">Provider</tspan><tspan x="2460" y="1051.2">API</tspan></text><text font-family="Arial" font-size="28" fill="#1a1a1a"><tspan x="2480" y="1300">Updates</tspan></text><text font-family="Arial" font-size="28" fill="#1a1a1a"><tspan x="1300" y="1300">Refresh</tspan></text></svg>