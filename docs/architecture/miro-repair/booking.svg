<svg xmlns="http://www.w3.org/2000/svg" width="3200" height="2240" viewBox="0 0 3200 2240"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10" fill="#313131"/></marker></defs><rect width="100%" height="100%" fill="white"/><text font-family="Arial" font-size="67" fill="#1a1a1a" font-weight="bold"><tspan x="64" y="131">A. Booking</tspan></text><text font-family="Arial" font-size="33" fill="#1a1a1a"><tspan x="64" y="217">Customer journey through verified payment. Fixed positions keep every step inside this frame.</tspan></text><rect x="64" y="256" width="3072" height="416" fill="#f0f5fd" stroke="#b0b0b0"/><text font-family="Arial" font-size="33" fill="#1a1a1a" font-weight="bold"><tspan x="96" y="321">DISCOVERY AND IDENTITY</tspan></text><rect x="64" y="800" width="3072" height="416" fill="#fffbed" stroke="#b0b0b0"/><text font-family="Arial" font-size="33" fill="#1a1a1a" font-weight="bold"><tspan x="96" y="865">QUOTE AND STOCK RESERVATION</tspan></text><rect x="64" y="1344" width="3072" height="416" fill="#f0f5fd" stroke="#b0b0b0"/><text font-family="Arial" font-size="33" fill="#1a1a1a" font-weight="bold"><tspan x="96" y="1409">PAYMENT AND DURABLE CONFIRMATION</tspan></text><polyline points="584,496 712,496" fill="none" stroke="#313131" stroke-width="2" marker-end="url(#arrow)"/><polyline points="1200,496 1328,496" fill="none" stroke="#313131" stroke-width="2" marker-end="url(#arrow)"/><polyline points="1816,496 1944,496" fill="none" stroke="#313131" stroke-width="2" marker-end="url(#arrow)"/><polyline points="2432,496 2560,496" fill="none" stroke="#313131" stroke-width="2" marker-end="url(#arrow)"/><polyline points="584,1040 712,1040" fill="none" stroke="#313131" stroke-width="2" marker-end="url(#arrow)"/><polyline points="1200,1040 1328,1040" fill="none" stroke="#313131" stroke-width="2" marker-end="url(#arrow)"/><polyline points="1816,1040 1944,1040" fill="none" stroke="#313131" stroke-width="2" marker-end="url(#arrow)"/><polyline points="2432,1040 2560,1040" fill="none" stroke="#313131" stroke-width="2" marker-end="url(#arrow)"/><polyline points="584,1584 712,1584" fill="none" stroke="#313131" stroke-width="2" marker-end="url(#arrow)"/><polyline points="1200,1584 1328,1584" fill="none" stroke="#313131" stroke-width="2" marker-end="url(#arrow)"/><polyline points="1816,1584 1944,1584" fill="none" stroke="#313131" stroke-width="2" marker-end="url(#arrow)"/><polyline points="2432,1584 2560,1584" fill="none" stroke="#313131" stroke-width="2" marker-end="url(#arrow)"/><rect x="96" y="384" width="488" height="224" rx="0" fill="#9CE6FF" stroke="#2C97BB" stroke-width="2"/><text font-family="Arial" font-size="33" fill="#1a1a1a"><tspan x="120" y="482">1. Web / Android / iOS</tspan><tspan x="120" y="528.2">Browse and sign in</tspan></text><rect x="712" y="384" width="488" height="224" rx="0" fill="#9CE6FF" stroke="#2C97BB" stroke-width="2"/><text font-family="Arial" font-size="33" fill="#1a1a1a"><tspan x="736" y="458.5">2. Cognito federation</tspan><tspan x="736" y="504.7">Google / Microsoft /</tspan><tspan x="736" y="550.9">Apple</tspan></text><rect x="1328" y="384" width="488" height="224" rx="0" fill="#9CE6FF" stroke="#2C97BB" stroke-width="2"/><text font-family="Arial" font-size="33" fill="#1a1a1a"><tspan x="1352" y="458.5">3. Catalog API / Valkey</tspan><tspan x="1352" y="504.7">Listings and current</tspan><tspan x="1352" y="550.9">prices</tspan></text><rect x="1944" y="384" width="488" height="224" rx="0" fill="#9CE6FF" stroke="#2C97BB" stroke-width="2"/><text font-family="Arial" font-size="33" fill="#1a1a1a"><tspan x="1968" y="458.5">4. Approved product</tspan><tspan x="1968" y="504.7">media</tspan><tspan x="1968" y="550.9">CloudFront delivery</tspan></text><rect x="2560" y="384" width="488" height="224" rx="0" fill="#9CE6FF" stroke="#2C97BB" stroke-width="2"/><text font-family="Arial" font-size="33" fill="#1a1a1a"><tspan x="2584" y="458.5">5. Own cart and address</tspan><tspan x="2584" y="504.7">Resource ownership</tspan><tspan x="2584" y="550.9">enforced</tspan></text><rect x="96" y="928" width="488" height="224" rx="0" fill="#FFE86D" stroke="#A28E26" stroke-width="2"/><text font-family="Arial" font-size="33" fill="#1a1a1a"><tspan x="120" y="1002.5">6. Server checkout quote</tspan><tspan x="120" y="1048.7">Tax / shipping /</tspan><tspan x="120" y="1094.9">discount</tspan></text><rect x="712" y="928" width="488" height="224" rx="0" fill="#FFE86D" stroke="#A28E26" stroke-width="2"/><text font-family="Arial" font-size="33" fill="#1a1a1a"><tspan x="736" y="979">7. Customer accepts</tspan><tspan x="736" y="1025.2">quote</tspan><tspan x="736" y="1071.4">Repricing requires</tspan><tspan x="736" y="1117.6">consent</tspan></text><rect x="1328" y="928" width="488" height="224" rx="0" fill="#FFE86D" stroke="#A28E26" stroke-width="2"/><text font-family="Arial" font-size="33" fill="#1a1a1a"><tspan x="1352" y="979">8. PostgreSQL</tspan><tspan x="1352" y="1025.2">transaction</tspan><tspan x="1352" y="1071.4">Reserve stock / pending</tspan><tspan x="1352" y="1117.6">order</tspan></text><rect x="1944" y="928" width="488" height="224" rx="0" fill="#FFE86D" stroke="#A28E26" stroke-width="2"/><text font-family="Arial" font-size="33" fill="#1a1a1a"><tspan x="1968" y="1026">9. Mapped Razorpay order</tspan><tspan x="1968" y="1072.2">Stable idempotency key</tspan></text><rect x="2560" y="928" width="488" height="224" rx="0" fill="#FFE86D" stroke="#A28E26" stroke-width="2"/><text font-family="Arial" font-size="33" fill="#1a1a1a"><tspan x="2584" y="979">10. Hosted Razorpay</tspan><tspan x="2584" y="1025.2">checkout</tspan><tspan x="2584" y="1071.4">Customer completes</tspan><tspan x="2584" y="1117.6">payment</tspan></text><rect x="96" y="1472" width="488" height="224" rx="0" fill="#B8ACFB" stroke="#8A7BE0" stroke-width="2"/><text font-family="Arial" font-size="33" fill="#1a1a1a"><tspan x="120" y="1546.5">11. Signed captured</tspan><tspan x="120" y="1592.7">webhook</tspan><tspan x="120" y="1638.9">Durable unique inbox</tspan></text><rect x="712" y="1472" width="488" height="224" rx="0" fill="#B8ACFB" stroke="#8A7BE0" stroke-width="2"/><text font-family="Arial" font-size="33" fill="#1a1a1a"><tspan x="736" y="1523">12. Validate payment</tspan><tspan x="736" y="1569.2">binding</tspan><tspan x="736" y="1615.4">Owner / amount /</tspan><tspan x="736" y="1661.6">currency</tspan></text><rect x="1328" y="1472" width="488" height="224" rx="0" fill="#B8ACFB" stroke="#8A7BE0" stroke-width="2"/><text font-family="Arial" font-size="33" fill="#1a1a1a"><tspan x="1352" y="1546.5">13. Atomic paid</tspan><tspan x="1352" y="1592.7">transaction</tspan><tspan x="1352" y="1638.9">OrderPaid outbox event</tspan></text><rect x="1944" y="1472" width="488" height="224" rx="0" fill="#B8ACFB" stroke="#8A7BE0" stroke-width="2"/><text font-family="Arial" font-size="33" fill="#1a1a1a"><tspan x="1968" y="1546.5">14. Outbox relay /</tspan><tspan x="1968" y="1592.7">EventBridge</tspan><tspan x="1968" y="1638.9">Fulfillment SQS queue</tspan></text><rect x="2560" y="1472" width="488" height="224" rx="0" fill="#B8ACFB" stroke="#8A7BE0" stroke-width="2"/><text font-family="Arial" font-size="33" fill="#1a1a1a"><tspan x="2584" y="1546.5">15. Post-Booking handoff</tspan><tspan x="2584" y="1592.7">Dispatch only after</tspan><tspan x="2584" y="1638.9">confirmation</tspan></text><text font-family="Arial" font-size="33" fill="#1a1a1a"><tspan x="64" y="1889">Read 1–5 left to right, then 6–10, then 11–15. Each row is a separate stage of the same booking lifecycle.</tspan></text><text font-family="Arial" font-size="33" fill="#1a1a1a"><tspan x="64" y="1985">Integrity: invalid or ambiguous payment remains pending for reconciliation; browser success never authorizes dispatch.</tspan></text><text font-family="Arial" font-size="33" fill="#1a1a1a"><tspan x="64" y="2081">Expiry: late captured payment requires a fresh stock check or compensating refund. Review stock owner and serviceability.</tspan></text></svg>