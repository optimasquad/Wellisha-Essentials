<svg xmlns="http://www.w3.org/2000/svg" width="3200" height="2240" viewBox="0 0 3200 2240"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10" fill="#313131"/></marker></defs><rect width="100%" height="100%" fill="white"/><text font-family="Arial" font-size="67" fill="#1a1a1a" font-weight="bold"><tspan x="64" y="131">B. Post-Booking Operations</tspan></text><text font-family="Arial" font-size="33" fill="#1a1a1a"><tspan x="64" y="217">Fulfillment, delivery tracking and controlled support actions. Cancellation is agent-only.</tspan></text><rect x="64" y="256" width="3072" height="416" fill="#f0f5fd" stroke="#b0b0b0"/><text font-family="Arial" font-size="33" fill="#1a1a1a" font-weight="bold"><tspan x="96" y="321">FULFILLMENT AND TRACKING</tspan></text><rect x="64" y="800" width="3072" height="416" fill="#fffbed" stroke="#b0b0b0"/><text font-family="Arial" font-size="33" fill="#1a1a1a" font-weight="bold"><tspan x="96" y="865">SUPPORT AND CANCELLATION</tspan></text><rect x="64" y="1344" width="3072" height="416" fill="#f0f5fd" stroke="#b0b0b0"/><text font-family="Arial" font-size="33" fill="#1a1a1a" font-weight="bold"><tspan x="96" y="1409">ELIGIBILITY, REFUNDS AND COMMUNICATIONS</tspan></text><polyline points="584,496 712,496" fill="none" stroke="#313131" stroke-width="2" marker-end="url(#arrow)"/><polyline points="1200,496 1328,496" fill="none" stroke="#313131" stroke-width="2" marker-end="url(#arrow)"/><polyline points="1816,496 1944,496" fill="none" stroke="#313131" stroke-width="2" marker-end="url(#arrow)"/><polyline points="2432,496 2560,496" fill="none" stroke="#313131" stroke-width="2" marker-end="url(#arrow)"/><polyline points="584,1040 712,1040" fill="none" stroke="#313131" stroke-width="2" marker-end="url(#arrow)"/><polyline points="1200,1040 1328,1040" fill="none" stroke="#313131" stroke-width="2" marker-end="url(#arrow)"/><polyline points="1816,1040 1944,1040" fill="none" stroke="#313131" stroke-width="2" marker-end="url(#arrow)"/><polyline points="2432,1040 2560,1040" fill="none" stroke="#313131" stroke-width="2" marker-end="url(#arrow)"/><polyline points="584,1584 712,1584" fill="none" stroke="#313131" stroke-width="2" marker-end="url(#arrow)"/><polyline points="1200,1584 1328,1584" fill="none" stroke="#313131" stroke-width="2" marker-end="url(#arrow)"/><polyline points="1816,1584 1944,1584" fill="none" stroke="#313131" stroke-width="2" marker-end="url(#arrow)"/><polyline points="2432,1584 2560,1584" fill="none" stroke="#313131" stroke-width="2" marker-end="url(#arrow)"/><rect x="96" y="384" width="488" height="224" rx="0" fill="#9CE6FF" stroke="#2C97BB" stroke-width="2"/><text font-family="Arial" font-size="33" fill="#1a1a1a"><tspan x="120" y="482">1. OrderPaid / outbox</tspan><tspan x="120" y="528.2">EventBridge / SQS</tspan></text><rect x="712" y="384" width="488" height="224" rx="0" fill="#9CE6FF" stroke="#2C97BB" stroke-width="2"/><text font-family="Arial" font-size="33" fill="#1a1a1a"><tspan x="736" y="458.5">2. Fulfillment worker</tspan><tspan x="736" y="504.7">Stable merchant request</tspan><tspan x="736" y="550.9">ID</tspan></text><rect x="1328" y="384" width="488" height="224" rx="0" fill="#9CE6FF" stroke="#2C97BB" stroke-width="2"/><text font-family="Arial" font-size="33" fill="#1a1a1a"><tspan x="1352" y="458.5">3. Contracted MCF / 3PL</tspan><tspan x="1352" y="504.7">Pack / dispatch /</tspan><tspan x="1352" y="550.9">deliver</tspan></text><rect x="1944" y="384" width="488" height="224" rx="0" fill="#9CE6FF" stroke="#2C97BB" stroke-width="2"/><text font-family="Arial" font-size="33" fill="#1a1a1a"><tspan x="1968" y="435">4. Tracking inbox and</tspan><tspan x="1968" y="481.2">polling</tspan><tspan x="1968" y="527.4">Normalized shipment</tspan><tspan x="1968" y="573.6">state</tspan></text><rect x="2560" y="384" width="488" height="224" rx="0" fill="#9CE6FF" stroke="#2C97BB" stroke-width="2"/><text font-family="Arial" font-size="33" fill="#1a1a1a"><tspan x="2584" y="458.5">5. Customer tracking</tspan><tspan x="2584" y="504.7">ETA / split shipments /</tspan><tspan x="2584" y="550.9">support</tspan></text><rect x="96" y="928" width="488" height="224" rx="0" fill="#FFE86D" stroke="#A28E26" stroke-width="2"/><text font-family="Arial" font-size="33" fill="#1a1a1a"><tspan x="120" y="979">6. Customer contacts</tspan><tspan x="120" y="1025.2">support</tspan><tspan x="120" y="1071.4">Case only; no order</tspan><tspan x="120" y="1117.6">mutation</tspan></text><rect x="712" y="928" width="488" height="224" rx="0" fill="#FFE86D" stroke="#A28E26" stroke-width="2"/><text font-family="Arial" font-size="33" fill="#1a1a1a"><tspan x="736" y="979">7. Authorized support</tspan><tspan x="736" y="1025.2">agent</tspan><tspan x="736" y="1071.4">MFA / role / case /</tspan><tspan x="736" y="1117.6">reason</tspan></text><rect x="1328" y="928" width="488" height="224" rx="0" fill="#FFE86D" stroke="#A28E26" stroke-width="2"/><text font-family="Arial" font-size="33" fill="#1a1a1a"><tspan x="1352" y="1002.5">8. Audited cancellation</tspan><tspan x="1352" y="1048.7">intent</tspan><tspan x="1352" y="1094.9">Serialize with dispatch</tspan></text><rect x="1944" y="928" width="488" height="224" rx="0" fill="#FFE86D" stroke="#A28E26" stroke-width="2"/><text font-family="Arial" font-size="33" fill="#1a1a1a"><tspan x="1968" y="1002.5">9. Provider cancellation</tspan><tspan x="1968" y="1048.7">Accepted / rejected /</tspan><tspan x="1968" y="1094.9">pending</tspan></text><rect x="2560" y="928" width="488" height="224" rx="0" fill="#FFE86D" stroke="#A28E26" stroke-width="2"/><text font-family="Arial" font-size="33" fill="#1a1a1a"><tspan x="2584" y="1026">10. Ambiguous outcome</tspan><tspan x="2584" y="1072.2">Reconcile before retry</tspan></text><rect x="96" y="1472" width="488" height="224" rx="0" fill="#B8ACFB" stroke="#8A7BE0" stroke-width="2"/><text font-family="Arial" font-size="33" fill="#1a1a1a"><tspan x="120" y="1523">11. Confirm refund</tspan><tspan x="120" y="1569.2">eligibility</tspan><tspan x="120" y="1615.4">Cancelled or verified</tspan><tspan x="120" y="1661.6">return/RTO</tspan></text><rect x="712" y="1472" width="488" height="224" rx="0" fill="#B8ACFB" stroke="#8A7BE0" stroke-width="2"/><text font-family="Arial" font-size="33" fill="#1a1a1a"><tspan x="736" y="1523">12. Refund worker /</tspan><tspan x="736" y="1569.2">Razorpay</tspan><tspan x="736" y="1615.4">Deduplicated refund</tspan><tspan x="736" y="1661.6">intent</tspan></text><rect x="1328" y="1472" width="488" height="224" rx="0" fill="#B8ACFB" stroke="#8A7BE0" stroke-width="2"/><text font-family="Arial" font-size="33" fill="#1a1a1a"><tspan x="1352" y="1523">13. Signed refund</tspan><tspan x="1352" y="1569.2">outcome</tspan><tspan x="1352" y="1615.4">Validate / persist /</tspan><tspan x="1352" y="1661.6">reconcile</tspan></text><rect x="1944" y="1472" width="488" height="224" rx="0" fill="#B8ACFB" stroke="#8A7BE0" stroke-width="2"/><text font-family="Arial" font-size="33" fill="#1a1a1a"><tspan x="1968" y="1523">14. Customer refund</tspan><tspan x="1968" y="1569.2">status</tspan><tspan x="1968" y="1615.4">Separate from shipment</tspan><tspan x="1968" y="1661.6">status</tspan></text><rect x="2560" y="1472" width="488" height="224" rx="0" fill="#B8ACFB" stroke="#8A7BE0" stroke-width="2"/><text font-family="Arial" font-size="33" fill="#1a1a1a"><tspan x="2584" y="1546.5">15. Email and SMS queues</tspan><tspan x="2584" y="1592.7">Delivery outcomes /</tspan><tspan x="2584" y="1638.9">retries</tspan></text><text font-family="Arial" font-size="33" fill="#1a1a1a"><tspan x="64" y="1889">Conditional flow: cancellation acceptance proceeds to eligibility. Pending outcomes reconcile; rejected requests follow the return policy.</tspan></text><text font-family="Arial" font-size="33" fill="#1a1a1a"><tspan x="64" y="1985">Customer calls to cancellation/refund execution APIs are forbidden. Opening a support case never automatically cancels.</tspan></text><text font-family="Arial" font-size="33" fill="#1a1a1a"><tspan x="64" y="2081">Refunds are bounded by captured money and existing refund intents. Notification failures never undo the order.</tspan></text></svg>